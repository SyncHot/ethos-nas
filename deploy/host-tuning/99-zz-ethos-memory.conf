# Memory tuning for a NAS box with zram swap — installed to
# /etc/sysctl.d/99-zz-ethos-memory.conf by setup_scripts/setup_host_tuning.sh.
#
# The `zz-` prefix is deliberate: systemd-sysctl applies files in filename order
# and an older /etc/sysctl.d/99-swappiness.conf (written for a disk swap file)
# would otherwise win. This file is the last word on swappiness.
#
# swappiness: with zram, anonymous pages are cheap to swap out (RAM speed, not
#   disk). The classic 10/60 values assume a slow disk swap file and leave the
#   box reclaiming page cache instead of compressing idle processes.
# page-cluster: 0 disables read-ahead on swap-in; zram reads are random-access
#   and look-ahead just wastes CPU.
# watermark_boost_factor: 0 stops the "boosted" reclaim watermark from keeping
#   background reclaim running long after a spike — the long tail of reclaim is
#   what pushes memory pressure (and systemd-oomd) over its threshold.
vm.swappiness = 150
vm.page-cluster = 0
vm.watermark_boost_factor = 0

# Keep a little more free memory for burst allocations (containers starting,
# package builds). 1 % of 16 GiB ≈ 160 MiB — cheap insurance against direct
# reclaim, which is what stalls the UI.
vm.min_free_kbytes = 196608
