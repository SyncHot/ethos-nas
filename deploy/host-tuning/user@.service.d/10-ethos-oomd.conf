# systemd-oomd policy for interactive user sessions — installed to
# /etc/systemd/system/user@.service.d/10-ethos-oomd.conf by
# setup_scripts/setup_host_tuning.sh.
#
# Ubuntu ships ManagedOOMMemoryPressure=kill with a 50 % limit for
# user@.service. On a box that also runs a NAS and containers, pressure inside
# a browser/VS Code session reaches 50 % routinely, so oomd killed the whole
# cgroup (editor, terminals, unsaved work) long before the machine was really
# out of memory.
#
# 80 % + zram: oomd still acts, but only on genuine thrashing. The EthOS unit
# itself is marked ManagedOOMPreference=avoid (deploy/ethos-nas.service), so
# the NAS is never the victim.
[Service]
ManagedOOMMemoryPressureLimit=80%
