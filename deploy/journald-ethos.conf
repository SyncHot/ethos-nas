# journald retention for the EthOS NAS unit (TODO.md P5-06).
#
# Install on a host where journald would otherwise grow without bound:
#   sudo install -D -m 0644 deploy/journald-ethos.conf \
#        /etc/systemd/journald.conf.d/50-ethos.conf
#   sudo systemctl restart systemd-journald
#
# Sizing rationale: the app logs at INFO and the App Events store keeps its own
# 1000-line ring, so 500 MB of journal is several weeks of normal operation.

[Journal]
SystemMaxUse=500M
SystemKeepFree=1G
MaxRetentionSec=90day
