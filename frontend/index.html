        .fm-search-input::placeholder { color: var(--fm-secondary); }
        .fm-search-clear {
            flex-shrink: 0;
            width: 18px; height: 18px;
            display: inline-flex; align-items: center; justify-content: center;
            background: transparent; border: none; cursor: pointer;
            color: var(--fm-secondary); font-size: 14px; line-height: 1;
            padding: 0; border-radius: 50%;
        }
        .fm-search-clear:hover { color: var(--fm-text); background: rgba(255,255,255,0.08); }

        /* ── Action toolbar buttons (row 2) ── */
        .fm-act-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 30px;
            padding: 0 10px;
            border-radius: 6px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--fm-text);
            font-size: 12.5px;
            cursor: pointer;
            transition: all 0.1s ease;
            white-space: nowrap;
            font-family: inherit;
        }
        .fm-act-btn:hover { background: var(--fm-hover); border-color: var(--fm-border); }
        .fm-act-btn:disabled { opacity: 0.4; cursor: default; }
        .fm-act-btn:disabled:hover { background: transparent; border-color: transparent; }
        .fm-act-btn.active { background: var(--fm-accent-soft); border-color: var(--fm-selected-border); color: var(--fm-accent); }
        .fm-act-btn.fm-act-danger { color: #f1777b; }
        .fm-act-btn.fm-act-danger:hover { background: rgba(229,72,77,0.12); border-color: rgba(229,72,77,0.3); color: #ff8f93; }
        .fm-act-ic { width: 16px; height: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .fm-act-sep { width: 1px; height: 22px; background: var(--fm-border); margin: 0 5px; flex-shrink: 0; }
        .fm-act-spacer { flex: 1; }

        .fm-inline-rename-input {
            background: var(--fm-input-bg);
            border: 1px solid var(--fm-accent);
            border-radius: 4px;
            color: var(--fm-text);
            font-size: 12px;
            padding: 2px 6px;
            outline: none;
            width: 80%;
            font-family: inherit;
            user-select: text;
        }

        /* ── Content area ── */
        .fm-content { flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; }
        .fm-content.fm-dnd-active { outline: 2px dashed rgba(59,130,246,0.35); outline-offset: -8px; border-radius: 8px; }

        /* Rubber-band selection rectangle */
        .fm-marquee {
            position: fixed; z-index: 9990; pointer-events: none;
            border: 1px solid var(--fm-accent);
            background: rgba(53,132,228,0.14);
            border-radius: 3px;
        }
        :root.light .fm-marquee { background: rgba(37,99,235,0.10); }

        /* Grid view — icon sizes (Large / Medium / Small) */
        .fm-content { --fm-cell: 88px; --fm-icon: 64px; --fm-name: 12.5px; }
        .fm-content.fm-size-large { --fm-cell: 116px; --fm-icon: 92px; --fm-name: 13px; }
        .fm-content.fm-size-medium { --fm-cell: 90px; --fm-icon: 64px; --fm-name: 12.5px; }
        .fm-content.fm-size-small { --fm-cell: 72px; --fm-icon: 46px; --fm-name: 12px; }

        .fm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--fm-cell), 1fr));
            justify-content: start;
            align-items: start;
            align-content: start;
            gap: 6px;
            padding: 12px;
        }

        .fm-file-item {
            max-width: 100%;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 4px 8px;
            cursor: pointer;
            transition: background 0.1s ease;
            border: 1.5px solid transparent;
            position: relative;
            user-select: none;
        }
        .fm-file-item:hover { background: var(--fm-hover); }
        .fm-file-item.selected { background: var(--fm-selected); border-color: var(--fm-selected-border); }
        .fm-file-item.fm-dragging { opacity: 0.4; }
        .fm-file-item.fm-drop-target { background: var(--fm-selected); border-color: var(--fm-accent); box-shadow: inset 0 0 0 1px var(--fm-accent); }

        /* Icon scaling per view size */
        .fm-file-item .fm-icon { width: var(--fm-icon); height: var(--fm-icon); border-radius: calc(var(--fm-icon) * 0.24); }
        .fm-file-item .fm-icon svg { width: calc(var(--fm-icon) * 0.52); height: calc(var(--fm-icon) * 0.52); }
        .fm-file-icon { width: var(--fm-icon); height: var(--fm-icon); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .fm-file-icon .fm-icon { width: 100%; height: 100%; }

        .fm-file-name {
            font-size: var(--fm-name);
            text-align: center;
            line-height: 1.3;
            overflow: hidden;
            max-width: 100%;
            color: var(--fm-text);
            padding: 0 2px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        /* Starred badge on grid items */
        .fm-item-star {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--fm-sidebar-bg);
            border: 1px solid var(--fm-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f5b53f;
            pointer-events: none;
        }

        /* Thumbnails in grid */
        .fm-file-thumb-wrap { border-radius: 10px; overflow: hidden; background: var(--surface-2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.25); position: relative; }
        .fm-content.fm-size-large .fm-file-thumb-wrap { width: var(--fm-icon); height: var(--fm-icon); }
        .fm-content.fm-size-medium .fm-file-thumb-wrap { width: var(--fm-icon); height: var(--fm-icon); }
        .fm-content.fm-size-small .fm-file-thumb-wrap { width: var(--fm-icon); height: var(--fm-icon); }
        .fm-grid-thumb { width: 100%; height: 100%; object-fit: cover; }
        .fm-file-thumb-wrap.fm-thumb-missing { background: var(--fm-hover); }
        .fm-file-thumb-wrap.fm-thumb-missing img { display: none; }
        .fm-video-play-badge { position: absolute; right: 5px; bottom: 5px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,0.6); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 10px; pointer-events: none; box-shadow: 0 1px 4px rgba(0,0,0,0.45); }

        /* Video thumbnails: wider 16:9 frame */
        .fm-file-thumb-wrap.fm-video-thumb { aspect-ratio: 16/9; width: calc(var(--fm-icon) * 1.5); height: auto; }

        /* Cinematic video preview (grid): video items span columns, thumbnail capped at 507×285 (16:9) */
        .fm-content { --fm-vid-span: 6; }
        .fm-content.fm-size-small { --fm-vid-span: 7; }
        .fm-content.fm-size-large { --fm-vid-span: 4; }
        .fm-content.fm-video-xl .fm-file-item.fm-video-item { grid-column: span var(--fm-vid-span); }
        .fm-content.fm-video-xl .fm-file-thumb-wrap.fm-video-thumb { width: min(507px, 100%); height: auto; aspect-ratio: 16/9; }

        /* Grid meta row (size · date / kind) */
        .fm-file-meta { font-size: 10.5px; color: var(--fm-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; line-height: 1.25; }

        /* Parent-folder (..) item */
        .fm-file-item.fm-parent-item { opacity: 0.65; }
        .fm-file-item.fm-parent-item:hover { opacity: 1; }

        /* Star badge sizing */
        .fm-item-star { font-size: 11px; line-height: 1; }

        /* List-view icon wrapper (positions the star badge over the tile) */
        .fm-list-ic { position: relative; display: inline-flex; flex-shrink: 0; }
        .fm-list-ic .fm-item-star { top: -5px; right: -6px; width: 15px; height: 15px; font-size: 9px; }

        /* ── List view (columns) ── */
        .fm-list-table { width: 100%; border-collapse: collapse; font-size: 12.5px; table-layout: fixed; }
        .fm-list-table thead th {
            text-align: left;
            padding: 8px 12px;
            color: var(--fm-secondary);
            font-weight: 600;
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--fm-border);
            position: sticky;
            top: 0;
            background: var(--fm-toolbar-bg);
            z-index: 2;
            user-select: none;
            cursor: pointer;
            white-space: nowrap;
        }
        .fm-list-table thead th:hover { background: var(--fm-hover); color: var(--fm-text); }
        .fm-list-table thead th .fm-sort-arrow { font-size: 9px; margin-left: 3px; color: var(--fm-accent); }
        .fm-list-table tbody tr { cursor: pointer; transition: background 0.08s ease; user-select: none; }
        .fm-list-table tbody tr:hover { background: var(--fm-hover); }
        .fm-list-table tbody tr.selected { background: var(--fm-selected); }
        .fm-list-table tbody tr.fm-dragging td { opacity: 0.5; }
        .fm-list-table tbody tr.fm-drop-target td { background: var(--fm-selected); }
        .fm-list-table td {
            padding: 7px 12px;
            border-bottom: 1px solid var(--border);
            color: var(--fm-text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .fm-list-table td:first-child span { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .fm-list-table td .fm-icon { width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0; }
        .fm-list-table td .fm-icon svg { width: 15px; height: 15px; }
        /* Universal Search — compact file icons in result rows */
        .us-row .fm-icon { width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0; }
        .us-row .fm-icon svg { width: 15px; height: 15px; }
        .fm-list-table td .fm-file-name-inline { overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
        .fm-col-name { width: auto; }
        .fm-col-kind { width: 92px; color: var(--fm-secondary); font-size: 11.5px; }
        .fm-col-size { width: 86px; text-align: right !important; color: var(--fm-secondary); }
        .fm-col-date { width: 158px; color: var(--fm-secondary); }
        .fm-col-owner { width: 96px; color: var(--fm-secondary); }
        .fm-col-perm { width: 64px; color: var(--fm-secondary); font-family: 'JetBrains Mono', monospace; font-size: 11px; }

        /* ── Empty state ── */
        .fm-empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; min-height: 200px; color: var(--fm-secondary); gap: 10px; }
        .fm-empty-state .fm-empty-ic { font-size: 44px; opacity: 0.5; }
        .fm-empty-state .fm-empty-title { font-size: 14px; color: var(--fm-text); font-weight: 500; }
        .fm-empty-state .fm-empty-sub { font-size: 12px; }

        /* ── Status bar ── */
        .fm-statusbar {
            height: 28px;
            background: var(--fm-sidebar-bg);
            border-top: 1px solid var(--fm-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            font-size: 11.5px;
            color: var(--fm-secondary);
            flex-shrink: 0;
        }

        /* ── Context menu ── */
        .fm-context-menu {
            position: fixed;
            z-index: 9000;
            background: var(--surface-0);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 5px;
            min-width: 220px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.55);
            animation: fmCtxIn 0.1s ease-out;
        }
        @keyframes fmCtxIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
        .fm-ctx-item {
            display: flex;
            align-items: center;
            gap: 9px;
            width: 100%;
            text-align: left;
            padding: 6.5px 10px;
            background: none;
            border: none;
            color: var(--fm-text);
            font-size: 12.5px;
            cursor: pointer;
            border-radius: 6px;
            font-family: inherit;
        }
        .fm-ctx-item:hover { background: var(--fm-accent-soft); }
        .fm-ctx-item.fm-ctx-danger { color: #f1777b; }
        .fm-ctx-item.fm-ctx-danger:hover { background: rgba(229,72,77,0.14); }
        .fm-ctx-item .fm-ctx-ic { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; color: var(--fm-secondary); flex-shrink: 0; }
        .fm-ctx-item .fm-ctx-key { margin-left: auto; font-size: 10.5px; color: var(--fm-secondary); }
        .fm-ctx-sep { height: 1px; background: var(--border); margin: 5px 8px; }
        .fm-sort-menu { min-width: 190px; }

        /* ── Properties dialog ── */
        .fm-props-dialog {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--surface-0);
            border: 1px solid var(--border);
            border-radius: 14px;
            min-width: 420px;
            max-width: 90%;
            z-index: 9500;
            box-shadow: 0 16px 56px rgba(0,0,0,0.6);
            animation: fmPropsIn 0.16s ease-out;
            overflow: hidden;
        }
        @keyframes fmPropsIn { from { opacity: 0; transform: translate(-50%, -46%) scale(0.97); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        .fm-props-header { display: flex; align-items: center; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--fm-border); }
        .fm-props-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .fm-props-icon .fm-icon { width: 44px; height: 44px; }
        .fm-props-icon .fm-icon svg { width: 26px; height: 26px; }
        .fm-props-name { font-size: 15px; font-weight: 600; color: var(--text-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
        .fm-props-type { font-size: 11px; color: var(--fm-secondary); }
        .fm-props-close { background: none; border: none; color: var(--fm-secondary); font-size: 20px; cursor: pointer; padding: 0 4px; line-height: 1; border-radius: 6px; flex-shrink: 0; }
        .fm-props-close:hover { background: var(--fm-hover); color: #fff; }
        .fm-props-body { padding: 10px 18px 14px; display: grid; grid-template-columns: 92px 1fr; row-gap: 9px; column-gap: 10px; align-items: baseline; }
        .fm-props-label { color: var(--fm-secondary); font-size: 12px; }
        .fm-props-value { color: var(--fm-text); font-size: 12.5px; word-break: break-all; }
        .fm-props-value.mono { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; }
        .fm-props-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--fm-border); background: var(--surface-2); }
        .fm-props-btn { padding: 6px 14px; border-radius: 7px; font-size: 12.5px; cursor: pointer; border: 1px solid var(--fm-border); background: transparent; color: var(--fm-text); font-family: inherit; }
        .fm-props-btn:hover { background: var(--fm-hover); }
        .fm-props-btn.primary { background: var(--fm-accent); border-color: var(--fm-accent); color: #fff; }
        .fm-props-btn.primary:hover { background: #2f76d0; }

        /* ── Trash toolbar ── */
        .fm-trash-toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--fm-border); flex-wrap: wrap; }
        .fm-trash-toolbar .fm-act-btn { height: 28px; }
        .fm-trash-toolbar .fm-trash-info { margin-left: auto; font-size: 11.5px; color: var(--fm-secondary); }

        /* Drag & Drop Upload Zone */
        .fm-drop-zone {
            position: fixed; inset: 0; z-index: 9995;
            display: none; align-items: center; justify-content: center;
            background: rgba(59,130,246,0.06);
            pointer-events: none;
            transition: all 0.25s ease;
        }
        .fm-drop-zone.fm-drop-active { display: flex; background: rgba(59,130,246,0.10); }
        .fm-drop-zone-content {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            padding: 44px 56px; border-radius: 20px;
            background: var(--surface-0);
            border: 2.5px dashed rgba(59,130,246,0.6);
            box-shadow: 0 16px 48px rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
        }
        .fm-drop-icon { font-size: 46px; }
        .fm-drop-text { font-size: 18px; font-weight: 700; color: var(--text-1); }
        .fm-drop-hint { font-size: 13px; color: var(--text-3); margin-top: 4px; }

        /* ── Preview Panel ── */
        .fm-preview-overlay { position: fixed; inset: 0; z-index: 4500; pointer-events: none; transition: opacity 0.2s ease; }
        .fm-preview-overlay.active { pointer-events: auto; }
        .fm-preview-backdrop { position: absolute; inset: 0; background: var(--overlay); backdrop-filter: blur(4px); }
        .fm-preview-panel {
            position: absolute; top: 0; right: 0; bottom: 0; width: 480px; max-width: 90vw;
            background: var(--surface-0); border-left: 1px solid var(--border);
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: -8px 0 32px rgba(0,0,0,0.3); transform: translateX(100%);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .fm-preview-panel.open { transform: translateX(0); }
        .fm-preview-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .fm-preview-title { flex: 1; min-width: 0; font-size: 14px; color: var(--text-1); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .fm-preview-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
        .fm-preview-action {
            background: none; border: none; color: var(--fm-secondary); font-size: 15px;
            cursor: pointer; padding: 4px 8px; line-height: 1; border-radius: 6px;
            transition: background 0.15s, color 0.15s;
        }
        .fm-preview-action:hover { background: var(--surface-2); color: var(--text-1); }
        .fm-preview-audio { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; }
        .fm-preview-audio-art { font-size: 56px; opacity: 0.6; }
        .fm-preview-audio audio { width: 100%; }
        .fm-preview-audio-name { font-size: 12px; color: var(--fm-secondary); text-align: center; word-break: break-all; }
        .fm-preview-pdf { width: 100%; height: 70vh; border: 0; border-radius: 8px; background: #fff; }
        .fm-preview-close { background: none; border: none; color: var(--fm-secondary); font-size: 22px; cursor: pointer; padding: 0 4px; line-height: 1; border-radius: 6px; transition: background 0.15s; flex-shrink: 0; }
        .fm-preview-close:hover { background: var(--surface-2); color: var(--text-1); }
        .fm-preview-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; align-items: center; justify-content: center; min-height: 0; }
        .fm-preview-body img { max-width: 100%; max-height: 60vh; border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,0.3); object-fit: contain; }
        .fm-preview-text { width: 100%; text-align: left; font-size: 13px; line-height: 1.6; color: var(--text-2); background: var(--surface-2); border-radius: 8px; padding: 16px; overflow: auto; max-height: 60vh; font-family: 'JetBrains Mono', monospace, system-ui; white-space: pre-wrap; word-break: break-all; border: 1px solid var(--border); }

        /* Scrollbars */
        .fm-grid::-webkit-scrollbar, .fm-content::-webkit-scrollbar, .fm-side-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .fm-grid::-webkit-scrollbar-thumb, .fm-content::-webkit-scrollbar-thumb, .fm-side-scroll::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }
        .fm-grid::-webkit-scrollbar-thumb:hover, .fm-content::-webkit-scrollbar-thumb:hover, .fm-side-scroll::-webkit-scrollbar-thumb:hover { background: var(--surface-2); border: 2px solid transparent; background-clip: padding-box; }

        /* Responsive */
        @media (max-width: 768px) {
            .fm-sidebar { width: 168px; min-width: 168px; }
            .fm-search-box { width: 130px; min-width: 100px; }
            .fm-content { --fm-cell: 76px; --fm-icon: 52px; }
            .fm-preview-panel { width: 100%; max-width: 100vw; }
        }

        /* ── Unified Modal System (alert / confirm / prompt) ── */
        .ethos-modal-overlay {
            position: fixed; inset: 0; z-index: 10000;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            animation: modalFadeIn 0.15s ease-out;
        }
        @keyframes modalFadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes modalSlideUp { from { opacity: 0; transform: translateY(24px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .ethos-modal-box {
            background: var(--surface-0, #111827); border: 1px solid var(--border);
            border-radius: 16px; width: 380px; max-width: 90vw;
            box-shadow: 0 24px 64px rgba(0,0,0,0.5);
            animation: modalSlideUp 0.2s ease-out;
            overflow: hidden;
        }
        .ethos-modal-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 24px 0; font-size: 16px; font-weight: 700; color: var(--text-1);
        }
        .ethos-modal-close {
            background: none; border: none; color: var(--text-3); cursor: pointer;
            font-size: 22px; padding: 0 4px; line-height: 1;
        }
        .ethos-modal-close:hover { color: var(--text-1); }
        .ethos-modal-body { padding: 16px 24px; }
        .ethos-modal-input {
            width: 100%; padding: 10px 14px; font-size: 14px;
            background: var(--surface-1); border: 1px solid var(--border);
            border-radius: 10px; color: var(--text-1); outline: none; box-sizing: border-box;
        }
        .ethos-modal-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }
        .ethos-modal-footer {
            display: flex; gap: 8px; justify-content: flex-end;
            padding: 0 24px 20px;
        }
        .ethos-modal-btn {
            padding: 8px 20px; font-size: 13px; font-weight: 600; border-radius: 10px;
            cursor: pointer; border: none; transition: all 0.15s ease;
        }
        .ethos-modal-btn-primary { background: #3b82f6; color: white; }
        .ethos-modal-btn-primary:hover { filter: brightness(1.15); }
        .ethos-modal-btn-ghost {
            background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border);
        }
        .ethos-modal-btn-ghost:hover { background: var(--surface-2); color: var(--text-1); }
        .ethos-modal-btn-danger { background: #ef4444; color: white; }
        .ethos-modal-btn-danger:hover { filter: brightness(1.15); }
        :root.light .ethos-modal-box { background: white; border-color: rgba(0,0,0,0.1); }
        :root.light .ethos-modal-header { color: #1e293b; }
        :root.light .ethos-modal-input { background: #f1f5f9; border-color: rgba(0,0,0,0.1); color: #1e293b; }
        :root.light .ethos-modal-btn-ghost { background: #f1f5f9; color: #475569; border-color: rgba(0,0,0,0.1); }

        /* ── File/Folder Picker (core/file-picker.js) ── */
        .fp-box { width: 560px; max-width: calc(100vw - 32px); }
        .fp-pathbar { display: flex; align-items: center; gap: 8px; padding: 4px 24px 0; }
        .fp-parent {
            display: flex; align-items: center; justify-content: center;
            width: 26px; height: 26px; border-radius: 7px; border: none; cursor: pointer;
            background: var(--surface-2); color: var(--text-2); transition: all 0.15s ease;
        }
        .fp-parent:hover { color: var(--text-1); }
        .fp-crumbs {
            flex: 1; min-width: 0; display: flex; align-items: center; gap: 3px;
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
            font-size: 13px; color: var(--text-2);
        }
        .fp-crumb { cursor: pointer; border-radius: 4px; padding: 1px 3px; }
        .fp-crumb:hover { color: var(--text-1); text-decoration: underline; }
        .fp-crumb-cur { color: var(--text-1); font-weight: 600; cursor: default; }
        .fp-sep { opacity: 0.45; flex-shrink: 0; }
        .fp-roots { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 24px 0; }
        .fp-roots[hidden] { display: none; }
        .fp-root {
            padding: 3px 10px; border: 1px solid var(--border); border-radius: 999px;
            background: var(--surface-1); color: var(--text-2); font-size: 11px;
            font-family: ui-monospace, Menlo, Consolas, monospace; cursor: pointer;
        }
        .fp-root:hover { color: var(--text-1); background: var(--surface-2); }
        .fp-root.cur { background: rgba(59, 130, 246, 0.16); border-color: rgba(59, 130, 246, 0.45); color: var(--text-1); }
        .fp-list {
            max-height: 320px; overflow-y: auto; padding-top: 8px;
            display: flex; flex-direction: column; gap: 1px;
        }
        .fp-row {
            display: flex; align-items: center; gap: 10px;
            padding: 6px 8px; border-radius: 8px; cursor: pointer;
            font-size: 13px; color: var(--text-1); transition: background 0.1s ease;
        }
        .fp-row:hover { background: var(--surface-2); }
        .fp-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
        .fp-row.hl { background: rgba(59, 130, 246, 0.18); }
        .fp-row.dim { opacity: 0.38; cursor: default; }
        .fp-ic { display: flex; align-items: center; justify-content: center; width: 20px; flex-shrink: 0; }
        .fp-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .fp-meta { font-size: 11px; color: var(--text-3); font-family: ui-monospace, Menlo, Consolas, monospace; flex-shrink: 0; }
        .fp-status { padding: 24px 8px; text-align: center; color: var(--text-3); font-size: 13px; }
        .fp-status.fp-err { color: #f87171; }
        .fp-sel {
            flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--text-2);
        }

        /* ── App Drawer (Ubuntu "Show Applications" — fullscreen grid) ── */
        .app-drawer-panel {
            /* Covers the screen except the topbar + dock — the "Show Applications"
               button stays clickable (GNOME dock behavior) to close the grid. */
            position: fixed; top: var(--topbar-h); left: 0; right: 0; bottom: 52px; z-index: 960;
            background: linear-gradient(160deg, #101826 0%, #0b1220 60%, #0a101c 100%);
            display: none; flex-direction: column;
        }
        .app-drawer-panel.open { display: flex; animation: drawerFade .18s ease-out; }
        .app-drawer-panel { transition: opacity .15s ease; }
        /* During drag the drawer must not capture pointer events — the desktop
           underneath is the drop target (drag over the faded drawer = drag over desktop). */
        .app-drawer-panel.drag-fade { opacity: .15; pointer-events: none; }
        @keyframes drawerFade { from { opacity: 0; transform: scale(1.015); } to { opacity: 1; transform: none; } }

        .drawer-search-wrap { padding: 32px 0 10px; display: flex; justify-content: center; flex-shrink: 0; }
        .drawer-search {
            width: min(420px, 72vw); padding: 11px 18px; border-radius: 999px;
            background: var(--surface-2); border: 1px solid var(--border);
            color: var(--text-1); font-size: 14px; outline: none; transition: all .15s;
            font-family: inherit;
        }
        .drawer-search:focus { border-color: rgba(91,154,255,.5); background: var(--surface-2); box-shadow: 0 0 0 3px rgba(53,132,228,.15); }
        .drawer-search::placeholder { color: var(--text-3); }

        .drawer-content {
            flex: 1; overflow-y: auto; padding: 16px 8vw 72px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
            gap: 8px; align-content: start;
        }

        .drawer-item {
            position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 14px 6px 10px; border-radius: 14px; cursor: pointer; transition: background .12s ease;
            gap: 8px; min-width: 90px; user-select: none;
        }
        .drawer-item:hover { background: var(--surface-2); }
        .drawer-item:active { background: var(--surface-2); }
        .drawer-item.dragging { opacity: .4; }
        .drawer-item-icon {
            width: 60px; height: 60px; border-radius: 15px; display: flex; align-items: center; justify-content: center;
            font-size: 32px; position: relative; overflow: hidden;
            background: linear-gradient(135deg, #243044, #1a2332);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 0 0 1px rgba(255,255,255,.07),
                        0 4px 12px rgba(0,0,0,.3);
        }
        .drawer-item-icon svg { display: block; filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
        .drawer-item-label {
            font-size: 12px; color: var(--text-2); text-align: center; line-height: 1.3; max-width: 96px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        /* Pinned-to-desktop indicator (Ubuntu dot) */
        .drawer-item.pinned::after {
            content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
            width: 5px; height: 5px; border-radius: 50%; background: var(--accent, #3584e4);
            box-shadow: 0 0 6px rgba(53,132,228,.8);
        }

        /* Right-click menu on drawer items */
        .drawer-ctx-menu {
            position: fixed; z-index: 9999; background: var(--surface-1); border: 1px solid var(--border);
            border-radius: 10px; padding: 4px 0; min-width: 190px; box-shadow: 0 16px 48px rgba(0,0,0,.5);
        }
        .drawer-ctx-item { padding: 8px 16px; font-size: 13px; color: var(--text-1); cursor: pointer; }
        .drawer-ctx-item:hover { background: rgba(91,154,255,.15); }

        /* Empty search results */
        .drawer-empty {
            position: absolute; top: 40%; left: 0; right: 0; text-align: center;
            color: var(--text-3); font-size: 15px;
        }

        /* Light theme adjustments for drawer */
        :root.light .app-drawer-panel { background: linear-gradient(160deg, #eef2f7 0%, #e2e8f0 100%); }
        :root.light .drawer-search { background: rgba(255,255,255,.8); color: #1e293b; border-color: rgba(0,0,0,.08); }
        :root.light .drawer-item-label { color: #334155; }
        :root.light .drawer-item:hover { background: rgba(0,0,0,.05); }
        :root.light .drawer-ctx-menu { background: #fff; border-color: rgba(0,0,0,.1); }
        :root.light .drawer-ctx-item { color: #1e293b; }
        :root.light .drawer-empty { color: #64748b; }

        /* ── Topbar "Show Applications" button (2x2 dot grid) ── */
        .show-apps-grid {
            width: 12px; height: 12px; display: block;
            background-image:
                radial-gradient(circle, #94a3b8 1.7px, transparent 1.9px),
                radial-gradient(circle, #94a3b8 1.7px, transparent 1.9px),
                radial-gradient(circle, #94a3b8 1.7px, transparent 1.9px),
                radial-gradient(circle, #94a3b8 1.7px, transparent 1.9px);
            background-size: 6px 6px;
            background-position: 0 0, 6px 0, 0 6px, 6px 6px;
            background-repeat: no-repeat;
        }
        .topbar-show-apps:hover .show-apps-grid { filter: brightness(1.5); }

        /* Drop hint — shown while dragging an app from the drawer over the desktop */
        #desktopDropHint {
            position: fixed; left: 20px; top: calc(var(--topbar-h) + 12px); right: 0; bottom: 64px; z-index: 970;
            border: 2px dashed rgba(91,154,255,.45); border-radius: 14px;
            background: rgba(53,132,228,.06); pointer-events: none;
            display: none; align-items: center; justify-content: center;
        }
        #desktopDropHint.active { display: flex; }
        #desktopDropHint::after {
            content: 'Drop to pin on Desktop';
            font-size: 15px; font-weight: 600; color: rgba(147,197,253,.9);
            text-shadow: 0 1px 8px rgba(0,0,0,.5);
        }

        /* ── Code Editor App (VS Code Dark+ look & feel) ─────────────────── */
        /* Palette: editor #1E1E1E · sidebar #252526 · activity bar #333333 ·
           status bar #007ACC · tabs #252526/#2D2D2D · accent #007ACC. */
        .ed-shell {
            display:flex; flex-direction:column; height:100%; min-height:0;
            --vs-editor:#1E1E1E; --vs-sidebar:#252526; --vs-activitybar:#333333;
            --vs-panel:#1E1E1E; --vs-statusbar:#007ACC; --vs-tabbar:#252526;
            --vs-tab-inactive:#2D2D2D; --vs-text:#CCCCCC; --vs-text-dim:#858585; --vs-text-bright:#FFFFFF;
            --vs-border:rgba(128,128,128,.25); --vs-hover:rgba(90,93,94,.35);
            --vs-active:#04395E; --vs-focus:#007FD4;
            --vs-btn:#0E639C; --vs-btn-hover:#1177BB;
            --vs-input:#3C3C3C;
            --vs-git-mod:#E2C089; --vs-git-add:#81B88B; --vs-git-del:#E06C75;
            --vs-diff-add:rgba(60,151,105,.22); --vs-diff-del:rgba(245,120,120,.25);
            --vs-diff-gutter-add:#357A3F; --vs-diff-gutter-del:#5A1D1D;
            --vs-font-ui:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
            --vs-font-mono:"Cascadia Code","JetBrains Mono",Consolas,Menlo,"Courier New",monospace;
            background:var(--vs-editor);
            font-family:var(--vs-font-ui);
        }
        .ed-content { flex:1; min-height:0; display:flex; flex-direction:column; }
        .ed-root { flex:1; min-height:0; display:flex; flex-direction:column; background:var(--vs-editor); }

        /* ── Menu bar (File / Edit / View / Terminal / Help) ────────────── */
        .ed-menubar {
            flex:none; height:27px; display:flex; align-items:center; gap:1px;
            background:#3C3C3C; border-bottom:1px solid var(--vs-border);
            padding:0 4px; font-family:var(--vs-font-ui);
        }
        .ed-menu-btn {
            border:none; background:none; color:var(--vs-text); font-size:12.5px;
            font-family:var(--vs-font-ui); padding:4px 8px; cursor:pointer; border-radius:3px;
        }
        .ed-menu-btn:hover, .ed-menu-btn.open { background:var(--vs-hover); color:var(--vs-text-bright); }
        .ed-menu {
            position:fixed; min-width:240px; max-height:70vh; overflow-y:auto;
            background:#2D2D2D; border:1px solid var(--vs-border);
            box-shadow:0 4px 14px rgba(0,0,0,.5); padding:4px 0; z-index:990;
        }
        .ed-menu-item {
            display:flex; align-items:center; justify-content:space-between; gap:28px;
            padding:5px 16px 5px 20px; font-size:12.5px; color:var(--vs-text);
            cursor:pointer; white-space:nowrap; font-family:var(--vs-font-ui);
        }
        .ed-menu-item:hover, .ed-menu-item.hl { background:var(--vs-active); color:var(--vs-text-bright); }
        .ed-menu-item[disabled] { color:var(--vs-text-dim); opacity:.55; cursor:default; }
        .ed-menu-item[disabled]:hover, .ed-menu-item[disabled].hl { background:none; color:var(--vs-text-dim); }
        .ed-menu-hint { color:var(--vs-text-dim); font-size:11px; }
        .ed-menu-item:hover .ed-menu-hint, .ed-menu-item.hl .ed-menu-hint { color:#B9B9B9; }

        /* In-file find / replace widget (Ctrl+F, Ctrl+Shift+F) */
        .ed-findbar {
            position:absolute; top:6px; right:12px; z-index:40;
            display:flex; align-items:center; gap:6px; flex-wrap:wrap;
            background:#252526; border:1px solid rgba(128,128,128,.35); border-radius:4px;
            box-shadow:0 4px 14px rgba(0,0,0,.45); padding:5px 8px;
            font-family:var(--vs-font-ui); max-width:calc(100% - 24px);
        }
        .ed-findbar[hidden] { display:none; }
        .ed-findbar-input {
            background:#3C3C3C; border:1px solid transparent; border-radius:3px;
            color:var(--vs-text); font-size:12px; padding:3px 8px; width:180px; outline:none;
        }
        .ed-findbar-input:focus { border-color:var(--vs-focus); }
        .ed-findbar-count { color:var(--vs-text-dim); font-size:11px; min-width:44px; text-align:center; }
        .ed-findbar-opt { font-size:12px; color:var(--vs-text-dim); cursor:pointer; user-select:none; }
        .ed-findbar-opt.on { color:var(--vs-text-bright); }
        .ed-findbar-replace-row { width:100%; display:flex; align-items:center; gap:6px; margin-top:2px; }
        .ed-findbar-replace-row[hidden] { display:none; }
        .ed-findbar-row { display:flex; align-items:center; gap:4px; width:100%; }
        .ed-findbar .ed-tb-btn[data-find] { min-width:22px; text-align:center; }
        .ed-findbar .ed-findbar-opt {
            border:1px solid transparent; background:none; border-radius:3px;
            padding:2px 5px; color:var(--vs-text-dim); cursor:pointer;
            font-size:11px; font-weight:600; font-family:var(--vs-font-ui); line-height:1.2;
        }
        .ed-findbar .ed-findbar-opt:hover { background:var(--vs-hover); color:var(--vs-text); }
        .ed-findbar .ed-findbar-opt.on {
            color:var(--vs-text-bright); border-color:var(--vs-focus);
            background:rgba(0,122,204,.18);
        }
        .ed-findbar-count.bad { color:#F48771; }
        .ed-crumb-actions .ed-tb-btn {
            border:1px solid var(--vs-border); border-radius:3px; padding:1px 8px;
            color:var(--vs-text); background:rgba(255,255,255,.03);
        }
        .ed-crumb-actions .ed-tb-btn:hover { background:var(--vs-hover); color:var(--vs-text-bright); }
        .ed-editors-empty-keys {
            display:flex; flex-wrap:wrap; gap:14px; margin-top:14px;
            font-size:11.5px; color:var(--vs-text-dim);
        }
        .ed-editors-empty-keys kbd {
            background:var(--vs-input); border:1px solid var(--vs-border); border-bottom-width:2px;
            border-radius:3px; padding:1px 6px; margin-right:5px;
            font-family:var(--vs-font-mono); font-size:10.5px; color:var(--vs-text);
        }
        .ed-menu-sep { height:1px; background:var(--vs-border); margin:4px 10px; }
        .ed-kbd-table { display:flex; flex-direction:column; gap:7px; min-width:320px; }
        .ed-kbd-row { display:flex; align-items:center; justify-content:space-between; gap:24px; font-size:13px; color:var(--vs-text); }
        .ed-kbd-row kbd {
            background:var(--vs-input); border:1px solid var(--vs-border); border-bottom-width:2px;
            border-radius:3px; padding:2px 7px; font-size:11.5px; font-family:var(--vs-font-mono);
            color:var(--vs-text-bright); white-space:nowrap;
        }
        .ed-about { display:flex; flex-direction:column; gap:10px; min-width:340px; }
        .ed-about-name { font-size:16px; font-weight:700; color:var(--vs-text-bright); }
        .ed-about-desc { font-size:13px; line-height:1.55; color:var(--vs-text); }

        /* ── Workbench: activity bar + sidebar + editor column ───────────── */
        .ed-workbench { flex:1; display:flex; min-height:0; }
        .ed-activitybar {
            width:48px; flex:none; background:var(--vs-activitybar);
            display:flex; flex-direction:column; align-items:center; padding-top:2px;
        }
        .ed-ab-item {
            position:relative; width:48px; height:44px; border:none; background:none;
            color:#858585; cursor:pointer; display:flex; align-items:center; justify-content:center;
            border-left:2px solid transparent;
        }
        .ed-ab-item svg { width:24px; height:24px; fill:currentColor; }
        .ed-ab-item:hover { color:#ffffff; }
        .ed-ab-item.active { color:#ffffff; border-left-color:#ffffff; }
        .ed-ab-badge {
            position:absolute; right:5px; bottom:4px; min-width:15px; height:15px; padding:0 3px;
            border-radius:8px; background:var(--vs-focus); color:#fff; font-size:9.5px; font-weight:600;
            display:flex; align-items:center; justify-content:center;
        }
        .ed-sidebar {
            width:264px; flex:none; background:var(--vs-sidebar);
            border-right:1px solid var(--vs-border); display:flex; flex-direction:column; min-height:0;
        }
        .ed-sidebar.collapsed { display:none; }
        .ed-side-resize { flex:none; width:4px; cursor:col-resize; z-index:2; background:transparent; }
        .ed-side-resize:hover, .ed-side-resize.active { background:var(--vs-focus); }
        .ed-sidebar.collapsed + .ed-side-resize { display:none; }
        body.ed-side-dragging, body.ed-side-dragging * { cursor:col-resize !important; user-select:none !important; }
        .ed-side-view { flex:1; min-height:0; display:flex; flex-direction:column; }
        .ed-side-view[hidden] { display:none; }
        .ed-side-header {
            flex:none; height:32px; display:flex; align-items:center; justify-content:space-between;
            padding:0 14px 0 18px; font-size:11px; letter-spacing:.08em; color:var(--vs-text-dim);
        }
        .ed-side-empty {
            flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
            gap:8px; padding:20px; text-align:center; color:var(--vs-text-dim); font-size:12.5px; line-height:1.5;
        }
        .ed-side-empty-icon { font-size:28px; opacity:.6; }

        /* Explorer */
        .ed-explorer-section {
            flex:none; display:flex; align-items:center; gap:4px;
            padding:3px 8px 3px 14px; font-size:11px; font-weight:700; letter-spacing:.05em;
        }
        .ed-explorer-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .ed-explorer-actions { margin-left:auto; display:flex; gap:2px; }
        .ed-tree { flex:1; min-height:0; overflow-y:auto; padding:2px 0; font-size:13px; }
        .ed-tree-row {
            display:flex; align-items:center; gap:5px; padding:3px 10px 3px 14px;
            cursor:pointer; white-space:nowrap; color:var(--vs-text); user-select:none;
        }
        .ed-tree-row:hover { background:var(--vs-hover); }
        .ed-tree-row.selected { background:var(--vs-active); }
        .ed-tree-caret { flex:none; width:12px; font-size:9px; color:var(--vs-text-dim); text-align:center; }
        .ed-tree-kids .ed-tree-row { padding-left:30px; }
        .ed-tree-kids .ed-tree-kids .ed-tree-row { padding-left:46px; }
        .ed-tree-kids .ed-tree-kids .ed-tree-kids .ed-tree-row { padding-left:62px; }
        .ed-tree-icon {
            flex:none; width:16px; height:16px; display:flex; align-items:center; justify-content:center;
            color:var(--vs-text-dim);
        }
        .ed-tree-icon.dir { color:#dcb67a; }
        .ed-tree-icon svg { width:14px; height:14px; fill:currentColor; }
        .ed-file-badge {
            flex:none; width:16px; height:16px; border-radius:3px;
            display:flex; align-items:center; justify-content:center;
            color:#fff; font-size:7px; font-weight:800; letter-spacing:-.02em;
            font-family:var(--vs-font-ui); line-height:1; user-select:none;
        }
        .ed-tab .ed-file-badge, .ed-search-row .ed-file-badge,
        .ed-search-file .ed-file-badge, .ed-quickopen-row .ed-file-badge {
            width:14px; height:14px; font-size:6.5px; border-radius:2px;
        }
        .ed-explorer-section { cursor:pointer; }
        .ed-explorer-section:hover { background:var(--vs-hover); }
        .ed-explorer-actions .ed-icon-btn { padding:2px 4px; }
        .ed-explorer-actions .ed-icon-btn svg { width:15px; height:15px; fill:currentColor; display:block; }
        .ed-tree-name { overflow:hidden; text-overflow:ellipsis; }
        .ed-tree-empty, .ed-tree-error { padding:8px 16px; font-size:12px; color:var(--vs-text-dim); }

        /* Search view */
        .ed-search-wrap { flex:none; padding:0 10px 8px; }
        .ed-search-input {
            width:100%; box-sizing:border-box; background:var(--vs-input);
            border:1px solid transparent; border-radius:2px; padding:5px 8px;
            font-size:12.5px; color:var(--vs-text); outline:none; font-family:var(--vs-font-ui);
        }
        .ed-search-input:focus { border-color:var(--vs-focus); }
        .ed-search-results { flex:1; min-height:0; overflow-y:auto; }
        .ed-search-row {
            display:flex; align-items:center; gap:6px; padding:3px 14px 3px 22px;
            font-size:12.5px; color:var(--vs-text); cursor:pointer;
        }
        .ed-search-row:hover { background:var(--vs-hover); }
        .ed-search-name { flex:none; max-width:45%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .ed-search-dir {
            flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
            direction:rtl; text-align:left; color:var(--vs-text-dim); font-size:11px;
        }
        .ed-search-count { padding:6px 14px; font-size:11.5px; color:var(--vs-text-dim); }

        /* Search — mode toggles + content matches */
        .ed-search-opts {
            display:flex; align-items:center; gap:6px; margin-top:6px;
            font-size:11px; color:var(--vs-text-dim);
        }
        .ed-search-mode { opacity:.65; }
        .ed-search-mode.active {
            opacity:1; background:var(--vs-active); color:var(--vs-text-bright);
            box-shadow:inset 0 0 0 1px var(--vs-focus);
        }
        .ed-search-opt { display:flex; align-items:center; gap:3px; cursor:pointer; user-select:none; }
        .ed-search-opt input { accent-color:var(--vs-focus); margin:0; }
        .ed-search-file {
            display:flex; align-items:baseline; gap:6px; padding:4px 14px;
            font-size:12.5px; color:var(--vs-text-bright); cursor:pointer;
            background:rgba(255,255,255,.03); border-top:1px solid var(--vs-border);
        }
        .ed-search-file:hover { background:var(--vs-hover); }
        .ed-search-line {
            display:flex; align-items:baseline; gap:8px; padding:2px 14px 2px 28px;
            font-size:12px; font-family:var(--vs-font-mono); color:var(--vs-text);
            cursor:pointer; white-space:nowrap; overflow:hidden;
        }
        .ed-search-line:hover { background:var(--vs-hover); }
        .ed-search-ln { flex:none; width:34px; text-align:right; color:var(--vs-text-dim); font-size:11px; }
        .ed-search-text { overflow:hidden; text-overflow:ellipsis; }

        /* Inline rename / new entry input in the Explorer */
        .ed-tree-row.ed-tree-inline { background:var(--vs-active); }
        .ed-tree-input {
            flex:1; min-width:0; background:var(--vs-input); color:var(--vs-text-bright);
            border:1px solid var(--vs-focus); border-radius:2px; padding:1px 4px;
            font-size:12.5px; font-family:var(--vs-font-ui); outline:none;
        }
        .ed-tree-row.ed-flash { animation:ed-flash-row .9s ease-out; }
        @keyframes ed-flash-row {
            0% { background:rgba(0,122,204,.45); }
            100% { background:transparent; }
        }

        /* Quick Open overlay (Ctrl+P) */
        .ed-quickopen {
            position:fixed; inset:0; z-index:9998; background:rgba(0,0,0,.35);
            display:flex; align-items:flex-start; justify-content:center; padding-top:12vh;
        }
        .ed-quickopen-box {
            width:min(620px, 92vw); max-height:60vh; display:flex; flex-direction:column;
            background:var(--vs-sidebar); border:1px solid var(--vs-focus); border-radius:4px;
            box-shadow:0 24px 80px rgba(0,0,0,.65); overflow:hidden;
        }
        .ed-quickopen-input {
            width:100%; box-sizing:border-box; background:var(--vs-input); color:var(--vs-text-bright);
            border:none; border-bottom:1px solid var(--vs-border); padding:10px 12px;
            font-size:14px; font-family:var(--vs-font-ui); outline:none;
        }
        .ed-quickopen-list { overflow-y:auto; min-height:0; }
        .ed-quickopen-row {
            display:flex; align-items:baseline; gap:10px; padding:6px 12px;
            font-size:12.5px; color:var(--vs-text); cursor:pointer;
        }
        .ed-quickopen-row.active, .ed-quickopen-row:hover { background:var(--vs-focus); color:#fff; }
        .ed-quickopen-name { flex:none; color:inherit; }
        .ed-quickopen-path {
            flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
            color:var(--vs-text-dim); font-size:11px;
        }
        .ed-quickopen-row.active .ed-quickopen-path { color:rgba(255,255,255,.8); }
        .ed-quickopen-empty { padding:10px 12px; font-size:12px; color:var(--vs-text-dim); }
        .ed-quickopen-hint {
            margin-left:auto; flex:none; font-size:11px; color:var(--vs-text-dim);
            font-family:var(--vs-font-mono);
        }
        .ed-quickopen-row.active .ed-quickopen-hint { color:rgba(255,255,255,.8); }

        /* Outline view */
        .ed-outline { flex:1; min-height:0; overflow-y:auto; padding:4px 0; }
        .ed-outline-row {
            display:flex; align-items:center; gap:6px; padding:3px 12px;
            font-size:12.5px; color:var(--vs-text); cursor:pointer;
            white-space:nowrap; user-select:none;
        }
        .ed-outline-row:hover { background:var(--vs-hover); }
        .ed-outline-kind {
            flex:none; width:16px; height:16px; border-radius:3px;
            display:flex; align-items:center; justify-content:center;
            font-size:10px; font-weight:700; font-family:var(--vs-font-mono);
            background:rgba(255,255,255,.06); color:var(--vs-text-dim);
        }
        .ed-outline-kind.k-function, .ed-outline-kind.k-method { color:#DCDCAA; }
        .ed-outline-kind.k-class { color:#4EC9B0; }
        .ed-outline-kind.k-type { color:#4EC9B0; }
        .ed-outline-kind.k-heading { color:#569CD6; }
        .ed-outline-kind.k-property { color:#9CDCFE; }
        .ed-outline-name { overflow:hidden; text-overflow:ellipsis; }
        .ed-outline-empty { padding:12px 16px; font-size:12px; color:var(--vs-text-dim); }

        /* Markdown preview */
        .ed-md-preview {
            position:absolute; inset:0; overflow:auto; background:var(--vs-editor);
            color:var(--vs-text); padding:18px 28px 60px; z-index:2;
        }
        .ed-md-body { max-width:900px; margin:0 auto; font-size:14px; line-height:1.65; }
        .ed-md-body h1, .ed-md-body h2, .ed-md-body h3,
        .ed-md-body h4, .ed-md-body h5, .ed-md-body h6 {
            color:var(--vs-text-bright); margin:1.2em 0 .5em; line-height:1.25;
        }
        .ed-md-body h1 { font-size:1.9em; border-bottom:1px solid var(--vs-border); padding-bottom:.3em; }
        .ed-md-body h2 { font-size:1.45em; border-bottom:1px solid var(--vs-border); padding-bottom:.25em; }
        .ed-md-body a { color:#4daafc; }
        .ed-md-body code {
            background:rgba(255,255,255,.08); padding:1px 5px; border-radius:3px;
            font-family:var(--vs-font-mono); font-size:.92em;
        }
        .ed-md-body pre {
            background:#252526; border:1px solid var(--vs-border); border-radius:4px;
            padding:12px 14px; overflow-x:auto;
        }
        .ed-md-body pre code { background:none; padding:0; }
        .ed-md-body blockquote {
            margin:.8em 0; padding:.2em 0 .2em 14px; border-left:3px solid var(--vs-focus);
            color:var(--vs-text-dim);
        }
        .ed-md-body table { border-collapse:collapse; margin:.8em 0; }
        .ed-md-body th, .ed-md-body td { border:1px solid var(--vs-border); padding:6px 10px; }
        .ed-md-body img { max-width:100%; }
        .ed-md-body hr { border:none; border-top:1px solid var(--vs-border); margin:1.4em 0; }

        /* CodeMirror search / jump dialogs (Ctrl+F / Ctrl+H / Ctrl+G) */
        .ed-cm .CodeMirror-dialog {
            background:#252526; color:var(--vs-text-bright); border-bottom:1px solid var(--vs-border);
            font-family:var(--vs-font-ui); font-size:12.5px; padding:4px 8px;
        }
        .ed-cm .CodeMirror-dialog-top { border-top:1px solid var(--vs-border); border-bottom:none; }
        .ed-cm .CodeMirror-dialog input {
            background:var(--vs-input); color:var(--vs-text-bright); border:1px solid var(--vs-focus);
            border-radius:2px; padding:2px 6px; font-family:var(--vs-font-mono); font-size:12.5px;
            outline:none;
        }
        .ed-cm .CodeMirror-dialog button {
            background:var(--vs-btn); color:#fff; border:none; border-radius:2px;
            padding:3px 8px; font-size:12px; cursor:pointer; margin-left:4px;
        }
        .ed-cm .CodeMirror-search-hint { color:var(--vs-text-dim); }
        .ed-cm .CodeMirror-search-field { width:220px; }

        /* Source Control view */
        .ed-scm-commit { flex:none; padding:0 10px 8px; display:flex; flex-direction:column; gap:6px; }
        .ed-scm-msg {
            width:100%; box-sizing:border-box; background:var(--vs-input);
            border:1px solid transparent; border-radius:2px; padding:6px 8px;
            font-size:12.5px; color:var(--vs-text); outline:none; font-family:var(--vs-font-ui);
            resize:none; line-height:1.4;
        }
        .ed-scm-msg:focus { border-color:var(--vs-focus); }
        .ed-scm-commit-btn {
            display:flex; align-items:center; justify-content:center; gap:6px;
            background:var(--vs-btn); border:none; border-radius:2px; color:#fff;
            font-size:12.5px; padding:6px 10px; cursor:pointer; font-family:var(--vs-font-ui);
        }
        .ed-scm-commit-btn:hover { background:var(--vs-btn-hover); }
        .ed-scm-commit-btn:disabled { opacity:.5; cursor:default; }
        .ed-scm-body { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; }
        .ed-scm-section {
            flex:none; display:flex; align-items:center; gap:6px;
            padding:7px 14px 3px; font-size:11px; font-weight:700; letter-spacing:.05em;
        }
        .ed-scm-count { color:var(--vs-text-dim); font-weight:400; }
        .ed-scm-files { flex:none; }
        .ed-scm-file {
            display:flex; align-items:center; gap:6px; padding:3px 14px 3px 26px;
            font-size:12.5px; color:var(--vs-text); cursor:pointer;
        }
        .ed-scm-file:hover { background:var(--vs-hover); }
        .ed-scm-file.selected { background:var(--vs-active); }
        .ed-scm-letter {
            flex:none; width:14px; text-align:center; font-size:11px; font-weight:700;
            font-family:var(--vs-font-mono);
        }
        .ed-scm-letter.M, .ed-scm-letter.R { color:var(--vs-git-mod); }
        .ed-scm-letter.A, .ed-scm-letter.U { color:var(--vs-git-add); }
        .ed-scm-letter.D, .ed-scm-letter.C { color:var(--vs-git-del); }
        .ed-scm-path { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .ed-scm-dir { color:var(--vs-text-dim); }
        .ed-scm-file-actions { display:none; gap:2px; }
        .ed-scm-file:hover .ed-scm-file-actions { display:flex; }
        .ed-scm-history { flex:1; min-height:40px; }
        .ed-scm-log { display:flex; flex-direction:column; gap:2px; padding:5px 14px; cursor:pointer; }
        .ed-scm-log:hover { background:var(--vs-hover); }
        .ed-scm-log-subject {
            font-size:12px; color:var(--vs-text);
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        }
        .ed-scm-log-meta { font-size:10.5px; color:var(--vs-text-dim); display:flex; gap:8px; }

        /* Pro sections: BRANCHES / REMOTES / STASH */
        .ed-scm-sec { cursor:pointer; user-select:none; }
        .ed-scm-sec:hover { background:var(--vs-hover); }
        .ed-scm-caret { font-size:9px; color:var(--vs-text-dim); width:10px; flex:none; }
        .ed-scm-sec-actions { margin-left:auto; display:flex; gap:2px; }
        .ed-scm-sec-actions .ed-tb-btn { padding:2px 5px; font-size:11px; }
        .ed-scm-sublabel { padding:6px 14px 2px 26px; font-size:10px; font-weight:700; letter-spacing:.08em; color:var(--vs-text-dim); }
        .ed-scm-file-current .ed-scm-file-label { color:var(--vs-git-add); }
        .ed-scm-row-btn { font-size:11px; padding:2px 5px; opacity:0; }
        .ed-scm-file:hover .ed-scm-row-btn { opacity:1; }
        .ed-scm-url { font-family:var(--vs-font-mono); font-size:11.5px; color:var(--vs-text-dim); }
        .ed-scm-stash-clear { color:var(--vs-text-dim); font-size:11.5px; font-style:italic; }
        .ed-scm-merge-warn {
            flex:none; display:flex; align-items:center; gap:6px; padding:6px 12px;
            font-size:11.5px; color:#CCA700; background:rgba(204,167,0,.12);
            border-bottom:1px solid rgba(204,167,0,.3);
        }

        /* Clone / new-project form inside modals */
        .ed-np-form { display:flex; flex-direction:column; gap:6px; }
        .ed-np-form label { font-size:11.5px; color:var(--text-2, #64748b); margin-top:4px; }
        .ed-np-parent-row { display:flex; gap:6px; align-items:center; }
        .ed-np-parent-row .ethos-modal-input { flex:1; min-width:0; }

        /* Editor column: tabs + breadcrumbs + editor surface */
        .ed-maincol { flex:1; min-width:0; display:flex; flex-direction:column; min-height:0; }
        .ed-tabs {
            flex:none; display:flex; align-items:stretch; background:var(--vs-tabbar);
            height:34px; overflow-x:auto; overflow-y:hidden; scrollbar-width:thin;
        }
        .ed-tabs::-webkit-scrollbar { height:3px; }
        .ed-tab {
            display:flex; align-items:center; gap:6px; padding:0 8px 0 12px; min-width:0; max-width:220px;
            background:var(--vs-tab-inactive); color:var(--vs-text-dim);
            border-right:1px solid rgba(0,0,0,.35); cursor:pointer; font-size:12.5px;
            position:relative; flex:none;
        }
        .ed-tab:hover { color:var(--vs-text); }
        .ed-tab.active { background:var(--vs-editor); color:var(--vs-text-bright); }
        .ed-tab.active::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:var(--vs-focus); }
        .ed-tab-icon { flex:none; width:14px; height:14px; display:flex; align-items:center; justify-content:center; color:var(--vs-text-dim); }
        .ed-tab-icon svg { width:13px; height:13px; fill:currentColor; }
        .ed-tab-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .ed-tab-dot {
            width:8px; height:8px; border-radius:50%; background:#CCCCCC; flex:none;
        }
        .ed-tab-close {
            border:none; background:none; color:var(--vs-text-dim); font-size:14px; line-height:1;
            padding:2px 4px; border-radius:4px; cursor:pointer; flex:none;
        }
        .ed-tab-close:hover { background:rgba(255,255,255,.18); color:#fff; }
        .ed-tabs .ed-tab-save {
            margin-left:auto; margin-right:8px; align-self:center; flex:none;
            border:1px solid var(--vs-border); border-radius:3px;
            padding:2px 9px; color:var(--vs-text); background:rgba(255,255,255,.03);
            font-size:11.5px;
        }
        .ed-tabs .ed-tab-save:hover { background:var(--vs-hover); color:var(--vs-text-bright); }

        .ed-breadcrumbs {
            flex:none; min-height:22px; display:flex; align-items:center; gap:0; padding:0 10px;
            background:var(--vs-editor); border-bottom:1px solid var(--vs-border);
            font-size:11.5px; color:var(--vs-text-dim); overflow:hidden; white-space:nowrap;
        }
        .ed-breadcrumbs[hidden] { display:none; }
        .ed-crumb { padding:2px 4px; border-radius:3px; cursor:pointer; }
        .ed-crumb:hover { background:var(--vs-hover); color:var(--vs-text); }
        .ed-crumb.current { color:var(--vs-text); cursor:default; }
        .ed-crumb-sep { margin:0 1px; opacity:.7; }
        .ed-crumb-actions { margin-left:auto; display:flex; gap:2px; }

        .ed-editors { flex:1; min-height:0; position:relative; overflow:hidden; background:var(--vs-editor); }
        .ed-editor-pane { position:absolute; inset:0; display:flex; flex-direction:column; }
        .ed-editor-pane[hidden] { display:none; }
        .ed-editor-pane .ed-cm { flex:1; min-height:0; }
        .ed-pane-loading { margin:auto; color:var(--vs-text-dim); font-size:12.5px; }
        .ed-pane-error {
            position:absolute; inset:0; display:flex; flex-direction:column;
            align-items:center; justify-content:center; gap:10px;
            text-align:center; padding:24px;
        }
        .ed-editors-empty {
            position:absolute; inset:0; display:flex; flex-direction:column;
            align-items:center; justify-content:center; gap:6px; color:var(--vs-text-dim);
        }
        .ed-editors-empty-icon { font-size:44px; opacity:.35; }
        .ed-editors-empty-hint { font-size:12px; opacity:.8; }
        .ed-main { flex:1; position:relative; min-height:0; overflow:hidden; }
        .ed-main .ed-cm, .ed-main .ed-textarea-fb { position:absolute; inset:0; }

        /* CodeMirror (VS Code Dark+) */
        .ed-cm .CodeMirror {
            height:100%; background:transparent; color:#D4D4D4;
            font-family:var(--vs-font-mono); font-size:13.5px; line-height:1.5;
        }
        .ed-cm .CodeMirror-gutters { background:transparent; border-right:1px solid var(--vs-border); width:auto; }
        .ed-cm .CodeMirror-linenumber { color:#858585; }
        .ed-cm .CodeMirror-cursor { border-left:2px solid #AEAFAD; }
        .ed-cm .CodeMirror-activeline-background { background:rgba(255,255,255,.045); }
        .ed-cm .CodeMirror-selected { background:#264F78; }
        .ed-cm .CodeMirror-matchingbracket { color:#FFD700; }
        .ed-cm .CodeMirror-foldGutter { border-right:none; }
        /* VS Code Dark+ token colors — the editor mounts with theme:'ed-vscode',
           which makes CodeMirror add the .cm-s-ed-vscode class; CM5 themes are
           plain CSS (there is no CodeMirror.defineTheme API). */
        .ed-cm .cm-s-ed-vscode .cm-comment { color:#6A9955; }
        .ed-cm .cm-s-ed-vscode .cm-string { color:#CE9178; }
        .ed-cm .cm-s-ed-vscode .cm-number { color:#B5CEA8; }
        .ed-cm .cm-s-ed-vscode .cm-atom { color:#569CD6; }
        .ed-cm .cm-s-ed-vscode .cm-keyword { color:#569CD6; }
        .ed-cm .cm-s-ed-vscode .cm-builtin { color:#4EC9B0; }
        .ed-cm .cm-s-ed-vscode .cm-variable,
        .ed-cm .cm-s-ed-vscode .cm-variable-2,
        .ed-cm .cm-s-ed-vscode .cm-def,
        .ed-cm .cm-s-ed-vscode .cm-property { color:#9CDCFE; }
        .ed-cm .cm-s-ed-vscode .cm-function { color:#DCDCAA; }
        .ed-cm .cm-s-ed-vscode .cm-qualifier { color:#D4D4D4; }
        .ed-cm .cm-s-ed-vscode .cm-operator { color:#D4D4D4; }
        .ed-cm .cm-s-ed-vscode .cm-tag { color:#569CD6; }
        .ed-cm .cm-s-ed-vscode .cm-attribute { color:#9CDCFE; }
        .ed-cm .cm-s-ed-vscode .cm-bracket { color:#FF00FF; }
        .ed-cm .cm-s-ed-vscode .cm-punctuation { color:#D4D4D4; }
        .ed-cm .cm-s-ed-vscode .cm-meta { color:#D4D4D4; }
        .ed-cm .cm-s-ed-vscode .cm-error { color:#F44747; }
        .ed-cm .cm-s-ed-vscode .CodeMirror-selectedtext { background:#264F78; }
        .ed-cm .cm-s-ed-vscode ::selection,
        .ed-cm .cm-s-ed-vscode ::-moz-selection { background:#264F78; color:inherit; }
        .ed-textarea-fb {
            width:100%; height:100%; box-sizing:border-box; resize:none; border:none; outline:none;
            background:transparent; color:#D4D4D4; font-family:var(--vs-font-mono);
            font-size:13.5px; line-height:1.5; padding:4px 8px;
        }

        /* Git diff gutter + line backgrounds */
        .ed-cm .CodeMirror-gutter-wrapper .ed-diff-gutter { width:auto; }
        .ed-diff-mark { display:block; width:4px; height:100%; }
        .ed-diff-mark.add { background:var(--vs-diff-gutter-add); }
        .ed-diff-mark.del { background:var(--vs-diff-gutter-del); }
        .ed-diff-line-add { background:var(--vs-diff-add); }
        .ed-diff-line-del { background:var(--vs-diff-del); }

        /* Bottom panel (tabs on top, body below) */
        .ed-panel {
            flex:none; display:flex; flex-direction:column;
            border-top:1px solid var(--vs-border); background:var(--vs-panel);
            position:relative; min-height:0;
        }
        /* Closed panel takes no space at all (the tab strip is part of the panel). */
        .ed-panel[hidden] { display:none; }
        /* Maximized: the panel fills the workbench and the editor area is hidden. */
        .ed-panel.ed-panel-max { flex:1 1 auto; height:auto; min-height:0; border-top:none; }
        .ed-panel-max .ed-panel-resize { display:none; }
        .ed-content[hidden] { display:none; }
        .ed-panel-resize { flex:none; height:4px; margin-top:-2px; cursor:row-resize; z-index:2; }
        .ed-panel-tabs {
            flex:none; display:flex; align-items:center; gap:0; height:32px; padding:0 6px;
            border-bottom:1px solid var(--vs-border); background:var(--vs-panel);
        }
        .ed-panel-tab {
            height:100%; border:none; background:none; color:var(--vs-text-dim);
            font-size:11px; font-weight:600; letter-spacing:.06em; padding:0 10px;
            cursor:pointer; border-bottom:2px solid transparent; font-family:var(--vs-font-ui);
            display:flex; align-items:center; gap:6px;
        }
        .ed-panel-tab:hover { color:var(--vs-text); }
        .ed-panel-tab.active { color:var(--vs-text-bright); border-bottom-color:var(--vs-focus); }
        .ed-panel-tab-dot {
            width:7px; height:7px; border-radius:50%; background:#4EC9B0; flex:none;
        }
        .ed-panel-tab-dot[data-kind="connecting"] { background:#E2C089; }
        .ed-panel-tab-dot[data-kind="reconnecting"] { background:#E2C089; }
        .ed-panel-tab-dot[data-kind="disconnected"] { background:#858585; }
        .ed-panel-tab-dot[data-kind="error"] { background:#E06C75; }
        .ed-panel-status { font-size:11px; color:var(--vs-text-dim); margin-left:4px; white-space:nowrap; }
        .ed-panel-status[data-kind="error"] { color:#E06C75; }
        .ed-panel-cwd {
            font-size:11px; color:var(--vs-text-dim); margin-left:8px;
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px;
        }
        .ed-panel-body { flex:1; min-height:0; overflow:hidden; background:var(--vs-editor); }
        .ed-panel-body[hidden] { display:none; }
        .ed-panel-view { width:100%; height:100%; }
        .ed-panel-view[hidden] { display:none; }

        /* Terminal (split panes) */
        .ed-term-splits { display:flex; width:100%; height:100%; }
        .ed-term-pane { flex:1; min-width:0; position:relative; display:flex; flex-direction:column; }
        .ed-term-pane + .ed-term-pane { border-left:1px solid var(--vs-border); }
        .ed-term-body { flex:1; min-height:0; width:100%; }
        .ed-term-body .xterm { padding:4px 8px; }
        .ed-term-body .xterm-viewport { background:var(--vs-editor) !important; }
        .ed-term-panebar {
            position:absolute; top:0; right:0; display:none; align-items:center; gap:4px;
            padding:2px 6px; background:rgba(37,37,38,.92); border-bottom-left-radius:4px; z-index:5;
        }
        .ed-term-pane:hover .ed-term-panebar { display:flex; }
        .ed-term-pane-label { font-size:10.5px; color:var(--vs-text-dim); font-family:var(--vs-font-mono); }
        .ed-term-pane-kill {
            border:none; background:none; color:var(--vs-text-dim); cursor:pointer;
            font-size:12px; padding:1px 4px; border-radius:3px; line-height:1;
        }
        .ed-term-pane-kill:hover { color:#fff; background:rgba(255,255,255,.18); }
        .ed-term-error { padding:10px 14px; font-size:12.5px; color:#E06C75; }

        /* Problems view (real per-file diagnostics) */
        .ed-out-scroll { width:100%; height:100%; overflow-y:auto; padding:6px 12px; font-family:var(--vs-font-mono); font-size:12px; }
        .ed-out-row { display:flex; gap:10px; padding:2px 0; align-items:baseline; }
        .ed-out-msg { color:var(--vs-text); white-space:pre-wrap; word-break:break-word; }
        .ed-out-src { color:var(--vs-text-dim); font-size:11px; flex:none; }
        .ed-out-empty { color:var(--vs-text-dim); font-size:12.5px; padding:10px 4px; font-family:var(--vs-font-ui); }
        .ed-prob-row {
            display:flex; gap:8px; padding:2px 4px; align-items:baseline;
            cursor:pointer; border-radius:3px;
        }
        .ed-prob-row:hover { background:rgba(255,255,255,.07); }
        .ed-prob-icon { flex:none; width:12px; text-align:center; font-size:11px; }
        .ed-prob-icon.error { color:#F48771; }
        .ed-prob-icon.warning { color:#CCA700; }
        .ed-prob-msg { color:var(--vs-text); white-space:pre-wrap; word-break:break-word; }
        .ed-prob-loc { color:var(--vs-text-dim); font-size:11px; flex:none; margin-left:auto; }
        .ed-prob-src { color:var(--vs-text-dim); font-size:11px; flex:none; }
        .ed-problem-line { background:rgba(244,135,113,.10) !important; }
        .ed-problem-line.warn { background:rgba(204,167,0,.10) !important; }
        .ed-sb-item.has-errors { color:#F48771; }
        .ed-sb-item.has-warnings { color:#CCA700; }

        /* Status bar (VS Code blue) */
        .ed-statusbar {
            flex:none; height:22px; background:var(--vs-statusbar); color:#fff;
            display:flex; align-items:center; justify-content:space-between;
            padding:0 6px; font-size:11.5px; font-family:var(--vs-font-ui);
        }
        .ed-sb-left, .ed-sb-right { display:flex; align-items:center; height:100%; min-width:0; }
        .ed-sb-item {
            display:inline-flex; align-items:center; gap:4px; padding:0 6px; height:100%;
            cursor:default; white-space:nowrap;
        }
        .ed-sb-item:hover { background:rgba(255,255,255,.14); }
        .ed-sb-item.clickable { cursor:pointer; }
        .ed-sb-branch { font-family:var(--vs-font-mono); }

        /* Shared small buttons */
        .ed-tb-btn {
            flex:none; border:none; background:none; color:var(--vs-text-dim); font-size:12px;
            padding:3px 7px; border-radius:4px; cursor:pointer; line-height:1; font-family:var(--vs-font-ui);
        }
        .ed-tb-btn:hover { color:var(--vs-text-bright); background:var(--vs-hover); }
        .ed-tb-btn.active { color:var(--vs-focus); }
        .ed-tb-btn:disabled { opacity:.5; cursor:default; }

        /* Loading / error states */
        .ed-root > .ed-loading { margin:auto; color:var(--vs-text-dim); font-size:13px; }
        .ed-root[data-testid="editor-error"] { align-items:center; justify-content:center; gap:10px; text-align:center; }

        /* Welcome screen */
        .ed-welcome {
            align-items:center; justify-content:flex-start; text-align:center;
            gap:10px; padding:28px 24px; overflow-y:auto;
        }
        .ed-prompt-icon { font-size:36px; line-height:1; }
        .ed-prompt-title { font-weight:600; font-size:16px; color:var(--vs-text-bright); }
        .ed-welcome-actions { display:flex; gap:8px; margin-top:4px; }
        .ed-welcome-divider {
            display:flex; align-items:center; gap:10px; width:100%; max-width:460px;
            color:var(--vs-text-dim); font-size:11.5px; margin-top:8px;
        }
        .ed-welcome-divider::before, .ed-welcome-divider::after { content:''; flex:1; height:1px; background:var(--vs-border); }
        .ed-prompt-form { display:flex; gap:8px; width:100%; max-width:460px; }
        .ed-prompt-input {
            flex:1; min-width:0; background:var(--vs-input); border:1px solid transparent;
            border-radius:2px; padding:8px 12px; font-family:var(--vs-font-mono);
            font-size:13px; color:var(--vs-text); outline:none;
        }
        .ed-prompt-input:focus { border-color:var(--vs-focus); }
        .ed-recents { width:100%; max-width:460px; text-align:left; }
        .ed-recents-title { font-size:11px; letter-spacing:.08em; color:var(--vs-text-dim); margin-bottom:6px; }
        .ed-recent-row {
            display:flex; align-items:center; gap:8px; padding:6px 10px;
            border-radius:3px; cursor:pointer; font-size:13px; color:var(--vs-text);
        }
        .ed-recent-row:hover { background:var(--vs-hover); }
        .ed-recent-empty { font-size:12px; color:var(--vs-text-dim); padding:4px 10px; }
        .ed-recent-name { flex:none; font-weight:600; }
        .ed-recent-path { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--vs-text-dim); font-size:11.5px; }
        .ed-recent-x { border:none; background:none; color:var(--vs-text-dim); font-size:14px; cursor:pointer; padding:2px 5px; border-radius:3px; }
        .ed-recent-x:hover { color:#fff; background:rgba(255,255,255,.18); }

        /* Binary / too-large states */
        .ed-root[data-testid="editor-binary"], .ed-root[data-testid="editor-toolarge"] {
            align-items:center; justify-content:center; gap:10px; text-align:center; padding:24px;
        }
        .ed-bin-icon { font-size:36px; line-height:1; }
        .ed-bin-title { font-weight:600; font-size:15px; color:var(--vs-text-bright); }
        .ed-bin-msg { font-size:13px; color:var(--vs-text-dim); line-height:1.5; max-width:420px; }

        /* Buttons inside the editor (VS Code style) */
        .ed-shell .btn-primary { background:var(--vs-btn); border:1px solid transparent; color:#fff; border-radius:2px; }
        .ed-shell .btn-primary:hover { background:var(--vs-btn-hover); }
        .ed-shell .btn-primary:disabled { opacity:.5; }
        .ed-shell .btn-ghost { background:transparent; border:1px solid var(--vs-border); color:var(--vs-text); border-radius:2px; }
        .ed-shell .btn-ghost:hover { background:var(--vs-hover); }

        /* Unsaved-changes dialog */
        .ed-unsaved-overlay {
            position:fixed; inset:0; z-index:9500; background:rgba(0,0,0,.45);
            display:flex; align-items:center; justify-content:center;
        }
        .ed-unsaved-box {
            background:#252526; border:1px solid rgba(128,128,128,.35); border-radius:6px;
            padding:18px 20px; min-width:340px; max-width:460px;
            box-shadow:0 24px 64px rgba(0,0,0,.5); font-family:var(--vs-font-ui);
        }
        .ed-unsaved-title { font-weight:600; font-size:14px; color:#fff; margin-bottom:6px; }
        .ed-unsaved-msg { font-size:13px; color:var(--vs-text-dim); margin-bottom:14px; word-break:break-word; }
        .ed-unsaved-actions { display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
        .ed-unsaved-actions .ed-ask-saveclose {
            background:var(--vs-btn); color:#fff; border:none; border-radius:2px;
            padding:6px 14px; font-size:12.5px; cursor:pointer;
        }
        .ed-unsaved-actions .ed-ask-saveclose:hover { background:var(--vs-btn-hover); }
        .ed-unsaved-actions .ed-ask-discard, .ed-unsaved-actions .ed-ask-cancel {
            background:transparent; color:var(--vs-text); border:1px solid var(--vs-border);
            border-radius:2px; padding:6px 14px; font-size:12.5px; cursor:pointer;
        }
        .ed-unsaved-actions .ed-ask-discard:hover, .ed-unsaved-actions .ed-ask-cancel:hover { background:var(--vs-hover); }

        /* Context menus (tree, terminal target) */
        .ed-tree-menu {
            position:fixed; z-index:9600; background:#2D2D2D;
            border:1px solid rgba(128,128,128,.35); border-radius:5px;
            box-shadow:0 8px 24px rgba(0,0,0,.5); padding:4px; min-width:170px;
            font-family:var(--vs-font-ui);
        }
        .ed-tree-menu-item {
            display:block; width:100%; text-align:left; border:none; background:none;
            color:var(--vs-text); font-size:12.5px; padding:5px 10px; border-radius:3px;
            cursor:pointer; white-space:nowrap;
        }
        .ed-tree-menu-item:hover { background:var(--vs-focus); color:#fff; }
        .ed-tree-menu-item.danger { color:#F48771; }
        .ed-tree-menu-item.danger:hover { background:#F48771; color:#fff; }
        .ed-tree-menu-item.disabled { opacity:.45; cursor:default; }
        .ed-tree-menu-item.disabled:hover { background:none; color:var(--vs-text); }
        .ed-tree-menu-sep { height:1px; background:var(--vs-border); margin:4px 6px; }

        /* ── Code Editor — light theme (VS Code Light+) ────────────────────
           The editor moved to the `ethos-editor` package, but its stylesheet
           still lives here (see docs/apps.md). Light is the EthOS default, so
           every surface and token needs a light variant. */
        :root.light .ed-shell {
            --vs-editor:#ffffff; --vs-sidebar:#f3f3f3; --vs-activitybar:#ececec;
            --vs-panel:#ffffff; --vs-tabbar:#f3f3f3; --vs-tab-inactive:#ececec;
            --vs-text:#333333; --vs-text-dim:#6b7280; --vs-text-bright:#111827;
            --vs-border:rgba(0,0,0,.12); --vs-hover:rgba(0,0,0,.06);
            --vs-active:#dbeafe; --vs-focus:#007FD4;
            --vs-input:#ffffff;
            --vs-diff-add:rgba(46,160,67,.15); --vs-diff-del:rgba(248,81,73,.15);
            --vs-diff-gutter-add:#2ea043; --vs-diff-gutter-del:#d1242f;
        }
        :root.light .ed-menubar { background:#ececec; }
        :root.light .ed-menu { background:#ffffff; box-shadow:0 6px 18px rgba(15,23,42,.18); }
        :root.light .ed-findbar { background:#f3f3f3; border-color:rgba(0,0,0,.15); }
        :root.light .ed-findbar-input { background:#ffffff; color:#333333; }
        :root.light .ed-md-body code { background:rgba(0,0,0,.05); }
        :root.light .ed-md-body pre { background:#f3f3f3; }
        :root.light .ed-cm .CodeMirror-dialog { background:#f3f3f3; color:#111827; }
        :root.light .ed-unsaved-box { background:#ffffff; box-shadow:0 24px 64px rgba(15,23,42,.25); }
        :root.light .ed-unsaved-title { color:#111827; }
        :root.light .ed-tree-menu { background:#ffffff; box-shadow:0 8px 24px rgba(15,23,42,.2); }
        :root.light .ed-cm .CodeMirror { color:#1f2430; }
        :root.light .ed-cm .CodeMirror-linenumber { color:#8a8f98; }
        :root.light .ed-cm .CodeMirror-cursor { border-left-color:#1f2430; }
        :root.light .ed-cm .CodeMirror-activeline-background { background:rgba(0,0,0,.04); }
        :root.light .ed-cm .CodeMirror-selected { background:#b3d4fc; }
