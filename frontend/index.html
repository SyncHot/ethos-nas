        :root.light .ed-cm .CodeMirror-matchingbracket { color:#0b6e99; }
        :root.light .ed-textarea-fb { color:#1f2430; }
        :root.light .ed-cm .cm-s-ed-vscode .cm-comment { color:#008000; }
        :root.light .ed-cm .cm-s-ed-vscode .cm-string { color:#a31515; }
        :root.light .ed-cm .cm-s-ed-vscode .cm-number { color:#098658; }
        :root.light .ed-cm .cm-s-ed-vscode .cm-atom,
        :root.light .ed-cm .cm-s-ed-vscode .cm-keyword,
        :root.light .ed-cm .cm-s-ed-vscode .cm-tag { color:#0000ff; }
        :root.light .ed-cm .cm-s-ed-vscode .cm-builtin { color:#267f99; }
        :root.light .ed-cm .cm-s-ed-vscode .cm-variable,
        :root.light .ed-cm .cm-s-ed-vscode .cm-variable-2,
        :root.light .ed-cm .cm-s-ed-vscode .cm-def,
        :root.light .ed-cm .cm-s-ed-vscode .cm-property,
        :root.light .ed-cm .cm-s-ed-vscode .cm-attribute { color:#001080; }
        :root.light .ed-cm .cm-s-ed-vscode .cm-function { color:#795e26; }
        :root.light .ed-cm .cm-s-ed-vscode .cm-qualifier,
        :root.light .ed-cm .cm-s-ed-vscode .cm-operator,
        :root.light .ed-cm .cm-s-ed-vscode .cm-punctuation,
        :root.light .ed-cm .cm-s-ed-vscode .cm-meta { color:#1f2430; }
        :root.light .ed-cm .cm-s-ed-vscode .cm-bracket { color:#af00db; }
        :root.light .ed-cm .cm-s-ed-vscode .cm-error { color:#cd3131; }
        :root.light .ed-cm .cm-s-ed-vscode .CodeMirror-selectedtext,
        :root.light .ed-cm .cm-s-ed-vscode ::selection,
        :root.light .ed-cm .cm-s-ed-vscode ::-moz-selection { background:#b3d4fc; }

    </style>
    <!-- Shared core app shell (docs/app-ui.md). Loaded after the desktop styles
         so the .ui-* component layer can rely on the theme tokens above. -->
    <link rel="stylesheet" href="/static/css/ethos-ui.css">
</head>
<body>
    <!-- Wallpaper -->
    <div class="desktop-bg wallpaper-aurora" id="desktopBg"></div>

    <!-- Top Bar -->
    <div class="topbar">
        <div class="topbar-left">
            <button id="topbar-app-drawer-btn" data-testid="topbar-app-drawer-btn" class="topbar-show-apps" title="Show Applications" aria-label="Show all applications" aria-haspopup="dialog"><span class="show-apps-grid"></span></button>
        </div>
        <div class="topbar-right">
            <div class="topbar-status" id="topbar-auth-area" title="System online">
                <span class="topbar-dot"></span>
                <span class="topbar-online-label">Online</span>
            </div>
            <button data-testid="notification-trigger" id="notificationDrawerTrigger"
                    class="topbar-icon-btn notif-bell" title="Notifications" type="button"
                    aria-label="Notifications" aria-haspopup="dialog" aria-expanded="false"
                    aria-controls="notificationDrawer">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2 7.5-2 7.5h16s-2-1.5-2-7.5"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/></svg>
                <span id="notificationCount" class="notif-badge" style="display:none;"></span>
            </button>
            <span class="topbar-sep"></span>
            <span id="topbar-clock" class="topbar-clock">--:--</span>
            <button data-testid="topbar-theme-toggle" onclick="toggleTheme()" class="topbar-icon-btn" title="Toggle theme" aria-label="Toggle theme">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <span class="topbar-sep"></span>
            <button data-testid="topbar-user-menu-btn" style="display:none;" class="topbar-user-chip" title="User menu" aria-label="User menu" aria-haspopup="menu" aria-expanded="false">
                <span class="user-avatar" id="topbar-avatar">?</span>
                <span class="user-name" id="topbar-username-short">&nbsp;</span>
            </button>
            <div data-testid="topbar-dropdown" class="topbar-dropdown">
                <div class="dd-user">
                    <span class="user-avatar lg" id="topbar-avatar-lg">?</span>
                    <div class="dd-user-meta">
                        <span class="dd-username" id="topbar-username-display">—</span>
                        <span class="dd-subtitle">Signed in to EthOS NAS</span>
                    </div>
                </div>
                <div class="dd-separator"></div>
                <button data-testid="topbar-restart-app" class="dd-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Restart app</button>
                <button data-testid="topbar-reboot-server" class="dd-item danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg> Reboot server</button>
                <div class="dd-separator"></div>
                <button data-testid="topbar-logout" class="dd-item danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Sign out</button>
            </div>
        </div>
    </div>

    <!-- Desktop Icons -->
    <div class="desktop-icons" id="desktopIcons">
        <!-- Icons are pinned by the user via the App Drawer (Ubuntu style) — starts empty -->
    </div>

    <!-- Taskbar -->
    <div class="taskbar" id="taskbar"></div>

    <!-- Edge strips: reveal the auto-hidden top bar / dock in immersive mode -->
    <div class="bar-trigger" id="barTriggerTop" data-testid="bar-trigger-top"></div>
    <div class="bar-trigger" id="barTriggerBottom" data-testid="bar-trigger-bottom"></div>

    <!-- Modal Overlay (transparent, no darkening) -->
    <div class="modal-overlay" id="modalOverlay"></div>

    <!-- Toast Container (notifications + upload panel target) -->
    <!-- aria-live: screen readers announce toasts (role=status keeps it polite) -->
    <div class="toast-container" id="toastContainer" role="status" aria-live="polite"
         aria-atomic="false" aria-relevant="additions"></div>

    <!-- Notification Center — right-edge sheet, global history (core/notification-center.js).
         Ids/testids are stable test anchors: notificationDrawer, notification-trigger,
         notificationCount, notification-event-<id>, notification-mark-all-read, … -->
    <aside id="notificationDrawer" class="notification-drawer" role="dialog" aria-modal="false"
           aria-labelledby="notificationDrawerTitle">
        <div class="notification-drawer-header">
            <span class="notif-header-title" id="notificationDrawerTitle" data-testid="notification-drawer-title">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2 7.5-2 7.5h16s-2-1.5-2-7.5"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/></svg>
                Notifications
                <span class="notif-header-unread" id="notifHeaderUnread" hidden></span>
            </span>
            <div class="notif-header-actions">
                <button class="notif-icon-btn" data-testid="notification-mark-all-read" type="button" title="Mark all as read" aria-label="Mark all as read">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.5 5 5 10-11"/></svg>
                </button>
                <button class="notif-icon-btn" data-testid="notification-clear-all" type="button" title="Clear all notifications" aria-label="Clear all notifications">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9.5 7V5h5v2"/><path d="M6.5 7 7.5 20h9L17.5 7"/></svg>
                </button>
                <button class="notif-icon-btn" data-testid="notification-settings" type="button" title="Notification settings" aria-label="Notification settings" aria-expanded="false" aria-controls="notifSettings">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/></svg>
                </button>
                <button class="notif-icon-btn" data-testid="notification-drawer-close" type="button" title="Close" aria-label="Close notifications">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
                </button>
            </div>
        </div>
        <div class="notif-settings" id="notifSettings">
            <label class="notif-setting-row" for="notifSoundToggle">
                <span>Play a short sound for warnings and errors</span>
                <input type="checkbox" class="notif-switch" id="notifSoundToggle" data-testid="notif-setting-sound">
            </label>
            <label class="notif-setting-row" for="notifDesktopToggle">
                <span>Desktop notification while this tab is in the background</span>
                <input type="checkbox" class="notif-switch" id="notifDesktopToggle" data-testid="notif-setting-desktop">
            </label>
        </div>
        <div class="notif-toolbar">
            <button class="notif-chip active" data-filter="all" type="button" data-testid="notif-filter-all">All <span class="notif-chip-count" id="notifCountAll"></span></button>
            <button class="notif-chip" data-filter="unread" type="button" data-testid="notif-filter-unread">Unread <span class="notif-chip-count" id="notifCountUnread"></span></button>
            <button class="notif-chip" data-filter="error" type="button" data-testid="notif-filter-errors">Errors</button>
            <input class="notif-search" id="notifSearch" type="search" placeholder="Search…" aria-label="Search notifications" data-testid="notif-search">
        </div>
        <div id="notificationDrawerList" class="notification-drawer-list" role="list"></div>
    </aside>

    <!-- Unified task progress panel (core/progress.js — placeholder for initial DOM presence) -->
    <div id="taskProgressPanel" class="task-progress-panel" style="display:none;"></div>

    <!-- PAM Login Form (fullscreen centered overlay) -->
    <div id="loginOverlay" class="login-screen" style="display:none;">
        <div class="login-box">
            <div style="text-align:center;margin-bottom:32px;">
                <div style="font-size:56px;display:block;margin-bottom:16px;filter:drop-shadow(0 4px 20px rgba(53,132,228,0.3));line-height:1;">&#x1F5A5;</div>
                <div style="font-size:28px;font-weight:700;color:white;letter-spacing:-0.5px;">EthOS NAS</div>
                <div id="loginSubtitle" style="font-size:13px;color: var(--text-3);margin-top:6px;">Sign in with your Linux credentials</div>
            </div>
            <form id="loginForm" data-testid="login-form" onsubmit="return false;" autocomplete="on">
                <div style="margin-bottom:18px;">
                    <label style="display:block;font-size:11px;font-weight:700;color: var(--text-2);margin-bottom:6px;letter-spacing:0.5px;text-transform:uppercase;">Username</label>
                    <div style="position:relative;">
                        <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color: var(--text-3);font-size:16px;pointer-events:none;">👤</span>
                        <input id="loginUsername" type="text" autocomplete="username" placeholder="Enter your username" data-testid="login-username" autofocus 
                            style="width:100%;padding:12px 16px 12px 42px;border-radius:12px;border:1.5px solid var(--border);background:rgba(0,0,0,0.25);color:white;font-size:14px;outline:none;transition:border-color 0.2s,box-shadow 0.2s;" />
                    </div>
                </div>
                <div style="margin-bottom:22px;">
                    <label style="display:block;font-size:11px;font-weight:700;color: var(--text-2);margin-bottom:6px;letter-spacing:0.5px;text-transform:uppercase;">Password</label>
                    <div style="position:relative;">
                        <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color: var(--text-3);font-size:16px;pointer-events:none;z-index:1;">🔑</span>
                        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter your password" data-testid="login-password" 
                            style="width:100%;padding:12px 42px 12px 42px;border-radius:12px;border:1.5px solid var(--border);background:rgba(0,0,0,0.25);color:white;font-size:14px;outline:none;transition:border-color 0.2s,box-shadow 0.2s;" />
                        <button type="button" id="loginPwToggle" tabindex="-1" 
                            style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color: var(--text-3);font-size:16px;cursor:pointer;padding:4px;z-index:1;line-height:1;transition:color 0.15s;" 
                            onclick="var p=document.getElementById('loginPassword');p.type=p.type==='password'?'text':'password';this.textContent=p.type==='password'?'👁️':'👁️‍🗨️';" 
                            onmouseenter="this.style.color = 'var(--text-2)'" onmouseleave="this.style.color = 'var(--text-3)'">👁️</button>
                    </div>
                </div>
                <button id="loginSubmitBtn" data-testid="login-submit" type="submit" 
                    style="width:100%;padding:13px;border-radius:12px;border:none;background:linear-gradient(135deg,#3584e4,#2563eb);color:white;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;">
                    <span id="loginBtnText">Sign in</span>
                    <span id="loginBtnSpinner" style="display:none;width:18px;height:18px;border:2px solid var(--border);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;"></span>
                </button>
            </form>
            <!-- First-run setup: shown instead of the login form while the
                 appliance is unclaimed (see backend/routers/setup.py). The code
                 is printed on the appliance's own screen, so the first browser
                 on the network cannot claim the box for itself. -->
            <div id="setupPanel" data-testid="setup-panel" style="display:none;">
                <p style="margin:0 0 18px;font-size:13px;line-height:1.6;color:var(--text-2);" data-setup-intro>
                    This appliance has not been set up yet. Enter the
                    <strong>setup code</strong> shown on its screen, then choose the
                    password for <strong id="setupUser">the admin account</strong>.
                </p>
                <div style="margin-bottom:16px;" data-setup-code-field>
                    <label style="display:block;font-size:11px;font-weight:700;color: var(--text-2);margin-bottom:6px;letter-spacing:0.5px;text-transform:uppercase;">Setup code</label>
                    <input id="setupCode" data-testid="setup-code" type="text" autocomplete="one-time-code" spellcheck="false"
                        placeholder="ABCD-EFGH" autofocus
                        style="width:100%;padding:12px 16px;border-radius:12px;border:1.5px solid var(--border);background:rgba(0,0,0,0.25);color:white;font-size:16px;letter-spacing:2px;outline:none;transition:border-color 0.2s,box-shadow 0.2s;" />
                </div>
                <div style="margin-bottom:16px;">
                    <label style="display:block;font-size:11px;font-weight:700;color: var(--text-2);margin-bottom:6px;letter-spacing:0.5px;text-transform:uppercase;">New password</label>
                    <input id="setupPassword" data-testid="setup-password" type="password" autocomplete="new-password"
                        placeholder="At least 10 characters"
                        style="width:100%;padding:12px 16px;border-radius:12px;border:1.5px solid var(--border);background:rgba(0,0,0,0.25);color:white;font-size:14px;outline:none;transition:border-color 0.2s,box-shadow 0.2s;" />
                </div>
                <div style="margin-bottom:22px;">
                    <label style="display:block;font-size:11px;font-weight:700;color: var(--text-2);margin-bottom:6px;letter-spacing:0.5px;text-transform:uppercase;">Repeat password</label>
                    <input id="setupConfirm" data-testid="setup-confirm" type="password" autocomplete="new-password"
                        placeholder="Same password again"
                        style="width:100%;padding:12px 16px;border-radius:12px;border:1.5px solid var(--border);background:rgba(0,0,0,0.25);color:white;font-size:14px;outline:none;transition:border-color 0.2s,box-shadow 0.2s;" />
                </div>
                <button id="setupSubmitBtn" data-testid="setup-submit" type="button"
                    style="width:100%;padding:13px;border-radius:12px;border:none;background:linear-gradient(135deg,#3584e4,#2563eb);color:white;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;">
                    <span id="setupBtnText">Set up this appliance</span>
                </button>
                <div style="text-align:center;margin-top:14px;">
                    <a href="#" id="setupShowLogin" style="color:var(--text-3);font-size:12px;text-decoration:none;">Already set up? Sign in</a>
                </div>
            </div>
            <div id="loginError" style="text-align:center;color:#ef4444;font-size:13px;min-height:22px;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:6px;"></div>
        </div>
    </div>

    <style>
        /* Login input focus styles */
        #loginUsername:focus, #loginPassword:focus {
            border-color: #3584e4 !important;
            box-shadow: 0 0 0 3px rgba(53,132,228,0.15) !important;
        }
        #loginSubmitBtn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(53,132,228,0.35);
        }
        #loginSubmitBtn:active:not(:disabled) {
            transform: translateY(0);
        }
        #loginSubmitBtn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        /* Shake animation for error */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 50%, 90% { transform: translateX(-4px); }
            30%, 70% { transform: translateX(4px); }
        }
        .login-error-shake {
            animation: shake 0.4s ease-in-out;
        }
    </style>

    <!-- PAM Login logic (inline, non-module) -->
    <script>
        // Show login overlay on page load if no valid token
        (function() {
            function isAuthed() {
                try {
                    var t = localStorage.getItem('token') || '';
                    if (!t) return false;
                    var p = t.split('.')[1]; var pad = p; while (pad.length % 4) pad += '=';
                    var d = JSON.parse(atob(pad.replace(/-/g, '+').replace(/_/g, '/')));
                    return !!(d && d.exp && d.exp > Date.now() / 1000);
                } catch (_) { return false; }
            }

            if (!isAuthed()) {
                document.getElementById('loginOverlay').style.display = 'flex';
                // A flashed appliance boots with a pending setup state: ask the
                // server (public endpoint, no secrets) and show the claim form
                // instead of the login form.
                fetch('/api/setup/status', { cache: 'no-store' })
                    .then(function(res) { return res.ok ? res.json() : null; })
                    .then(function(state) { if (state && state.required) showSetup(state); })
                    .catch(function(_) { /* older server or offline: keep the login form */ });
            } else {
                var overlay = document.getElementById('loginOverlay');
                if (overlay) overlay.style.display = 'none';
            }

            function showSetup(state) {
                var form = document.getElementById('loginForm');
                var panel = document.getElementById('setupPanel');
                if (!form || !panel) return;
                form.style.display = 'none';
                panel.style.display = 'block';
                // On the appliance's own network the code is unnecessary: the
                // person who flashed it is already there. It is only demanded
                // when the request arrives through a proxy or from outside.
                var needsCode = state.code_required !== false;
                panel.dataset.noCode = needsCode ? '' : '1';
                var codeField = panel.querySelector('[data-setup-code-field]');
                if (codeField) codeField.style.display = needsCode ? '' : 'none';
                var intro = panel.querySelector('[data-setup-intro]');
                if (intro && !needsCode) {
                    intro.textContent = 'This appliance has not been set up yet. Choose the password for ';
                    var account = document.createElement('strong');
                    account.textContent = state.user || 'the admin account';
                    intro.appendChild(account);
                    intro.appendChild(document.createTextNode('.'));
                }
                var subtitle = document.getElementById('loginSubtitle');
                if (subtitle) subtitle.textContent = 'First-run setup';
                var user = document.getElementById('setupUser');
                if (user && state.user) user.textContent = state.user;
                var focusEl = needsCode ? document.getElementById('setupCode')
                                        : document.getElementById('setupPassword');
                if (focusEl) focusEl.focus();
            }

            function showLoginForm() {
                var form = document.getElementById('loginForm');
                var panel = document.getElementById('setupPanel');
                if (panel) panel.style.display = 'none';
                if (form) form.style.display = 'block';
                var subtitle = document.getElementById('loginSubtitle');
                if (subtitle) subtitle.textContent = 'Sign in with your Linux credentials';
                var user = document.getElementById('loginUsername');
                if (user) user.focus();
            }

            function setupFail(message) {
                var errorEl = document.getElementById('loginError');
                if (!errorEl) return;
                errorEl.textContent = '❌ ' + message;
                errorEl.classList.remove('login-error-shake');
                void errorEl.offsetWidth;
                errorEl.classList.add('login-error-shake');
            }

            function submitSetup() {
                var codeEl = document.getElementById('setupCode');
                var pwEl = document.getElementById('setupPassword');
                var confirmEl = document.getElementById('setupConfirm');
                var errorEl = document.getElementById('loginError');
                var btn = document.getElementById('setupSubmitBtn');
                var btnText = document.getElementById('setupBtnText');
                var code = (codeEl ? codeEl.value : '').trim();
                var password = pwEl ? pwEl.value : '';
                var confirm = confirmEl ? confirmEl.value : '';
                var panel = document.getElementById('setupPanel');
                var needsCode = !(panel && panel.dataset.noCode);

                if (errorEl) { errorEl.textContent = ''; errorEl.classList.remove('login-error-shake'); }
                if (needsCode && !code) { setupFail('Enter the setup code shown on the appliance screen'); return; }
                if (password.length < 10) { setupFail('Use at least 10 characters'); return; }
                if (password !== confirm) { setupFail('The two passwords do not match'); return; }

                if (btn) btn.disabled = true;
                if (btnText) btnText.textContent = 'Setting up…';

                fetch('/api/setup/claim', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code, password: password })
                }).then(function(res) { return res.json().then(function(d) { return { status: res.status, data: d }; }); })
                .then(function(result) {
                    if (result.status === 200 && result.data && result.data.token) {
                        localStorage.setItem('token', result.data.token);
                        window.location.reload();
                        return;
                    }
                    var detail = (result.data && result.data.detail) || 'Setup failed';
                    setupFail(detail);
                    if (pwEl) { pwEl.value = ''; pwEl.focus(); }
                    if (confirmEl) confirmEl.value = '';
                }).catch(function(_) {
                    setupFail('Connection failed. Is the server running?');
                }).finally(function() {
                    if (btn) btn.disabled = false;
                    if (btnText) btnText.textContent = 'Set up this appliance';
                });
            }

            document.getElementById('setupSubmitBtn')?.addEventListener('click', submitSetup);
            document.getElementById('setupShowLogin')?.addEventListener('click', function(e) {
                e.preventDefault();
                showLoginForm();
            });
            ['setupCode', 'setupPassword', 'setupConfirm'].forEach(function(id) {
                document.getElementById(id)?.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') { e.preventDefault(); submitSetup(); }
                });
            });

            // Wire up form submission
            function submitLogin() {
                var usernameEl = document.getElementById('loginUsername');
                var passwordEl = document.getElementById('loginPassword');
                var errorEl = document.getElementById('loginError');
                var btn = document.getElementById('loginSubmitBtn');
                var btnText = document.getElementById('loginBtnText');
                var spinner = document.getElementById('loginBtnSpinner');

                if (errorEl) { errorEl.textContent = ''; errorEl.classList.remove('login-error-shake'); }
                if (btn) { btn.disabled = true; }
                if (btnText) btnText.textContent = 'Signing in...';
                if (spinner) spinner.style.display = 'inline-block';

                fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameEl.value.trim(), password: passwordEl.value })
                }).then(function(res) { return res.json().then(function(d) { return { status: res.status, data: d }; }); })
                .then(function(result) {
                    if (result.status === 200) {
                        localStorage.setItem('token', result.data.token);
                        document.getElementById('loginOverlay').style.display = 'none';
                        window.location.reload();
                    } else {
                        var msg = result.data.detail || 'Invalid credentials';
                        if (errorEl) { errorEl.textContent = '❌ ' + msg; void errorEl.offsetWidth; errorEl.classList.add('login-error-shake'); }
                        if (passwordEl) { passwordEl.value = ''; passwordEl.focus(); }
                    }
                }).catch(function(err) {
                    if (errorEl) { errorEl.textContent = '⚠️ Connection failed. Is the server running?'; }
                }).finally(function() {
                    if (btn) { btn.disabled = false; }
                    if (btnText) btnText.textContent = 'Sign in';
                    if (spinner) spinner.style.display = 'none';
                });
            }

            document.getElementById('loginSubmitBtn')?.addEventListener('click', submitLogin);
            document.getElementById('loginForm')?.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { e.preventDefault(); submitLogin(); }
            });

            // Escaping for the inline (pre-boot) script — it cannot import
            // core/utils.js. Same semantics as escapeAttr() there: all five
            // characters, and 0 renders as "0" (TODO.md P3-02).
            const _HTML_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
            function escapeHtml(s) {
                return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => _HTML_MAP[c]);
            }
        })();
    </script>
    <script>
        // ════ Theme Toggle (T-UX1) — icon swap is CSS-driven (.icon-sun/.icon-moon) ════
        (function() {
            var KEY = 'ethos-theme';
            var html = document.documentElement;
            function applyTheme(theme) {
                if (theme === 'dark') {
                    html.classList.add('dark');
                    html.classList.remove('light');
                    localStorage.setItem(KEY, 'dark');
                } else {
                    html.classList.add('light');
                    html.classList.remove('dark');
                    localStorage.setItem(KEY, 'light');
                }
            }
            var saved = localStorage.getItem(KEY);
            applyTheme(saved === 'dark' ? 'dark' : 'light');
            window.toggleTheme = function() {
                var isLight = html.classList.contains('light');
                applyTheme(isLight ? 'dark' : 'light');
            };
        })();
    </script>

    <!-- Frontend error reporter: hooks window.onerror / unhandledrejection /
         console.error+warn → queue in core/logger.js → POST /api/logs/ingest
         (one unified store; see docs/logs.md).
         Loaded before app.js so bootstrap errors are captured too. -->
    <script type="module" src="/static/core/error-reporter.js?v=esm-v7"></script>
    <script type="module" src="/static/app.js?v=esm-v9"></script>
</body>
</html>
