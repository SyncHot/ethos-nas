<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Music — EthOS</title>
    <meta name="description" content="Your NAS music on the phone: search, playlists, podcasts, radio and offline downloads.">
    <meta name="theme-color" content="#121212">
    <link rel="manifest" href="/manifest-music.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/music-apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Music">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/progress.css">
    <link rel="stylesheet" href="/static/css/music.css">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('ethos-theme');
                document.documentElement.className = theme === 'light' ? 'light' : 'dark';
            } catch (_) {
                document.documentElement.className = 'dark';
            }
        })();
    </script>
</head>
<body>
    <div id="toastContainer" class="toast-container" aria-live="polite" role="status"></div>

    <!-- Sign-in (the NAS credentials, same JWT as the desktop) -->
    <section id="mu-login" class="mu-login" hidden data-testid="music-login">
        <form id="mu-login-form" class="mu-login-card" autocomplete="on">
            <div class="mu-login-icon" aria-hidden="true">🎵</div>
            <h1>EthOS Music</h1>
            <p>Zaloguj się kontem NAS.</p>
            <label>
                <span>Użytkownik</span>
                <input id="mu-username" name="username" autocapitalize="none" autocorrect="off"
                       autocomplete="username" required>
            </label>
            <label>
                <span>Hasło</span>
                <input id="mu-password" name="password" type="password" autocomplete="current-password" required>
            </label>
            <button type="submit" class="mu-btn primary" id="mu-login-submit">Zaloguj</button>
            <p id="mu-login-error" class="mu-login-error" role="alert"></p>
        </form>
    </section>

    <!-- Main app -->
    <div id="mu-app" class="mu-app" hidden data-testid="music-app">
        <header class="mu-top">
            <div class="mu-brand">
                <img class="mu-brand-icon" src="/static/icons/music-192.png" alt="" width="22" height="22" decoding="async">
                <strong>Music</strong>
            </div>
            <span id="mu-net" class="mu-pill" role="status" hidden>Offline</span>
            <div class="mu-top-actions">
                <button type="button" class="mu-icon-btn" id="mu-install" title="Zainstaluj aplikację" hidden>⤓</button>
                <button type="button" class="mu-icon-btn" id="mu-menu-btn" title="Menu"
                        aria-label="Menu" aria-expanded="false">⋯</button>
            </div>
            <div id="mu-menu" class="mu-menu" hidden>
                <button type="button" data-action="downloads">Pobrane</button>
                <button type="button" data-action="theme">Motyw jasny / ciemny</button>
                <button type="button" data-action="logout">Wyloguj</button>
            </div>
        </header>

        <main id="mu-content" class="mu-content" aria-live="polite"></main>

        <div id="mu-mini" class="mu-mini" hidden data-testid="music-mini">
            <img id="mu-mini-art" class="mu-mini-art" alt="" decoding="async">
            <div class="mu-mini-main">
                <div id="mu-mini-title" class="mu-mini-title"></div>
                <div id="mu-mini-sub" class="mu-mini-sub"></div>
            </div>
            <button type="button" class="mu-mini-toggle" id="mu-mini-play" aria-label="Odtwórz / pauza">▶</button>
            <i class="mu-mini-progress" id="mu-mini-progress" aria-hidden="true"></i>
        </div>

        <nav class="mu-nav" id="mu-nav" aria-label="Nawigacja">
            <button type="button" class="mu-navitem active" data-view="home" data-testid="music-nav-home">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>
                <span>Start</span>
            </button>
            <button type="button" class="mu-navitem" data-view="search" data-testid="music-nav-search">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21" stroke-linecap="round"/></svg>
                <span>Szukaj</span>
            </button>
            <button type="button" class="mu-navitem" data-view="podcasts" data-testid="music-nav-podcasts">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="2.4"/><path d="M12 4a8 8 0 0 0-8 8h2a6 6 0 0 1 12 0h2a8 8 0 0 0-8-8zm0 4a4 4 0 0 0-4 4h2a2 2 0 0 1 4 0h2a4 4 0 0 0-4-4z"/><path d="M10.6 16h2.8l.9 5h-4.6z"/></svg>
                <span>Podcasty</span>
            </button>
            <button type="button" class="mu-navitem" data-view="radio" data-testid="music-nav-radio">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M12 3a9 9 0 0 0-9 9h2a7 7 0 0 1 14 0h2a9 9 0 0 0-9-9zm0 4a5 5 0 0 0-5 5h2a3 3 0 0 1 6 0h2a5 5 0 0 0-5-5z"/><circle cx="12" cy="16" r="1.4"/></svg>
                <span>Radio</span>
            </button>
            <button type="button" class="mu-navitem" data-view="library" data-testid="music-nav-library">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><rect x="4" y="4" width="3" height="16" rx="1"/><rect x="9.5" y="7" width="3" height="13" rx="1"/><rect x="15" y="10" width="3" height="10" rx="1"/></svg>
                <span>Biblioteka</span>
            </button>
            <button type="button" class="mu-navitem" data-view="settings" data-testid="music-nav-settings">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="3.4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4" stroke-linecap="round"/></svg>
                <span>Ustawienia</span>
            </button>
        </nav>
    </div>

    <!-- Full-screen player -->
    <div id="mu-player" class="mu-player" hidden data-testid="music-player">
        <div class="mu-player-bg" id="mu-player-bg" aria-hidden="true"></div>
        <div class="mu-player-inner">
            <div class="mu-player-head">
                <button type="button" class="mu-icon-btn" id="mu-player-close" aria-label="Zamknij odtwarzacz">⌄</button>
                <span class="mu-player-label" id="mu-player-label">Odtwarzanie</span>
                <div class="mu-player-head-actions">
                    <button type="button" class="mu-icon-btn" id="mu-sleep" aria-label="Wyłącznik czasowy">⏱</button>
                    <button type="button" class="mu-icon-btn" id="mu-queue-btn" aria-label="Kolejka">☰</button>
                </div>
            </div>
            <div class="mu-player-art-wrap">
                <img id="mu-player-art" class="mu-player-art" alt="" decoding="async">
            </div>
            <div class="mu-player-track">
                <div class="mu-player-track-main">
                    <div id="mu-player-title" class="mu-player-title"></div>
                    <div id="mu-player-sub" class="mu-player-sub"></div>
                </div>
                <button type="button" class="mu-icon-btn mu-like" id="mu-player-like" aria-label="Polub">♥</button>
            </div>
            <div class="mu-player-slider">
                <span id="mu-pos" class="mu-time">0:00</span>
                <input id="mu-seek" class="mu-range" type="range" min="0" max="1000" step="1" value="0" aria-label="Przewiń">
                <span id="mu-dur" class="mu-time right">0:00</span>
            </div>
            <div id="mu-player-live" class="mu-player-live" hidden>● NA ŻYWO</div>
            <div class="mu-player-controls">
                <button type="button" class="mu-ctl" id="mu-shuffle" aria-label="Losowo" aria-pressed="false">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M10.59 9.17L5.42 4 4 5.42l5.17 5.17 1.42-1.42zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                </button>
                <button type="button" class="mu-ctl" id="mu-prev" aria-label="Poprzedni">
                    <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button type="button" class="mu-playbig" id="mu-play" aria-label="Odtwórz / pauza">▶</button>
                <button type="button" class="mu-ctl" id="mu-next" aria-label="Następny">
                    <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
                <button type="button" class="mu-ctl" id="mu-repeat" aria-label="Powtarzanie" aria-pressed="false">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                </button>
            </div>
            <div id="mu-sleep-hint" class="mu-sleep-hint" hidden></div>
        </div>
        <aside id="mu-queue" class="mu-queue" hidden aria-label="Kolejka">
            <div class="mu-queue-head">
                <b>Kolejka</b>
                <div class="mu-queue-head-actions">
                    <button type="button" class="mu-smcircle" id="mu-queue-clear">Wyczyść</button>
                    <button type="button" class="mu-icon-btn" id="mu-queue-close" aria-label="Zamknij kolejkę">✕</button>
                </div>
            </div>
            <div id="mu-queue-list" class="mu-queue-list"></div>
        </aside>
    </div>

    <div id="mu-sheet" class="mu-sheet" hidden>
        <div class="mu-sheet-backdrop" data-close="sheet"></div>
        <article class="mu-sheet-card" role="dialog" aria-modal="true" aria-labelledby="mu-sheet-title">
            <button type="button" class="mu-sheet-close" data-close="sheet" aria-label="Zamknij">✕</button>
            <h2 class="mu-sheet-title" id="mu-sheet-title"></h2>
            <div id="mu-sheet-body" class="mu-sheet-body"></div>
        </article>
    </div>

    <script src="/static/vendor/hls.min.js"></script>
    <script type="module" src="/static/music/music.js"></script>
</body>
</html>
